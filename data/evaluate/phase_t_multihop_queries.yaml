metadata:
  name: phase_t_multihop_queries
  version: 0.1
  created: 2026-06-29
  purpose: >
    Phase T starter benchmark for diagnosing whether retrieval failures come
    from vector search, graph/PPR search, hybrid fusion, or later agent layers.
  notes: >
    gold_chunks is intentionally sparse in v0.1. Treat it as verified evidence
    anchors, not a complete gold set. Queries without gold_chunks are
    discovery-only and excluded from aggregate retrieval metrics.

queries:
  - id: T001
    query: "How exposed is AMD to TSMC supply risk?"
    type: graph_multihop
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["amd", "tsmc"]
    gold_chunks:
      - AMD_2026_Item_1A_0008_e84e4130
      - AMD_2025_Item_1A_0009_57657610
      - AMD_2025_Item_1A_0011_10eec6d1
    gold_evidence_groups:
      amd_tsmc_supply_risk:
        - AMD_2026_Item_1A_0008_e84e4130
        - AMD_2025_Item_1A_0009_57657610
        - AMD_2025_Item_1A_0011_10eec6d1
    answer_points:
      - AMD depends on third-party manufacturing partners such as TSMC.
      - Capacity, wafer supply, or yield issues at these partners can materially affect AMD.
    notes: >
      Gold audit 2026-07-07: original 2026 Item 1A chunk is valid, but the
      2025 Item 1A chunks are also direct evidence for AMD dependency on
      TSMC/third-party foundries, wafer supply, capacity, and yield risks.
      AMD_2025_Item_1_0009_c842eea0 is useful supporting business context
      about manufacturing arrangements, but is not direct Item 1A risk evidence.

  - id: T002
    query: "Which foundry partner manufactures the Hopper architecture chips?"
    type: supplier_via_product
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["hopper", "nvidia", "tsmc"]
    gold_chunks:
      - NVDA_2024_Item_1_0007_bae70036
      - NVDA_2025_Item_1_0008_a4407f7e
      - NVDA_2026_Item_1_0007_bf6a51b6
      - NVDA_2024_Item_7_0007_d25e117d
      - NVDA_2025_Item_7_0000_78a2a641
      - NVDA_2025_Item_7_0003_d53d3047
    answer_points:
      - Hopper is associated with NVIDIA.
      - TSMC appears as an important foundry/manufacturing partner in the supply chain.
    gold_evidence_groups:
      hopper_evidence:
        - NVDA_2024_Item_7_0007_d25e117d
        - NVDA_2025_Item_7_0000_78a2a641
        - NVDA_2025_Item_7_0003_d53d3047
      supplier_evidence:
        - NVDA_2024_Item_1_0007_bae70036
        - NVDA_2025_Item_1_0008_a4407f7e
        - NVDA_2026_Item_1_0007_bf6a51b6
    notes: >
      Gold audit 2026-07-07: no single chunk in Neo4j contains both Hopper
      and TSMC. Treat this as a two-evidence multi-hop query: Hopper chunks
      establish the NVIDIA product/platform, and NVIDIA Item 1 supplier chunks
      establish TSMC/Samsung foundry wafer manufacturing. Removed AMD/INTC
      chunks from direct gold because they are competitor/manufacturing context,
      not evidence for Hopper's foundry partner.

  - id: T003
    query: "Who produces the dense memory chips that power modern AI training accelerators?"
    type: supplier_via_product
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["micron", "hbm", "ai accelerators"]
    gold_chunks:
      - MU_2023_Item_1A_0003_92be33e3
      - MU_2025_Item_1A_0004_836bee10
      - NVDA_2024_Item_1_0007_bae70036
      - NVDA_2025_Item_1_0008_a4407f7e
      - NVDA_2026_Item_1_0007_bf6a51b6
    answer_points:
      - High-bandwidth memory is important for AI accelerators.
      - Micron is one producer/supplier of these memory products.
    gold_evidence_groups:
      direct_answer:
        - MU_2023_Item_1A_0003_92be33e3
        - MU_2025_Item_1A_0004_836bee10
      supplier_context:
        - NVDA_2024_Item_1_0007_bae70036
        - NVDA_2025_Item_1_0008_a4407f7e
        - NVDA_2026_Item_1_0007_bf6a51b6
    notes: >
      Gold audit 2026-07-07: the Micron Item 1A chunks are the direct answer
      evidence. The NVIDIA Item 1 chunks are valid supporting evidence from the
      candidate pool because they explicitly name Micron as a memory supplier.
      RMBS HBM chunks are supportive ecosystem context, but not direct proof of
      who produces the memory chips, so they stay out of direct gold for now.

  - id: T004
    query: "What AI accelerator product line does the main x86 desktop CPU rival of Intel offer?"
    type: competitor_product
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["intel", "amd", "amd instinct"]
    gold_chunks:
      - AMD_2026_Item_1_0003_ea53a6a5
      - AMD_2026_Item_1_0007_f252541b
      - AMD_2025_Item_1_0006_551768e4
      - AMD_2024_Item_1_0009_01379c5a
      - INTC_2026_Item_1_0008_c74f560f
      - AMD_2024_Item_1_0011_49024c2d
    answer_points:
      - AMD is Intel's x86 CPU rival.
      - AMD offers Instinct AI accelerator products.
    gold_evidence_groups:
      direct_answer:
        - AMD_2026_Item_1_0003_ea53a6a5
        - AMD_2026_Item_1_0007_f252541b
        - AMD_2025_Item_1_0006_551768e4
        - AMD_2024_Item_1_0009_01379c5a
      competitor_context:
        - INTC_2026_Item_1_0008_c74f560f
        - AMD_2024_Item_1_0011_49024c2d
    notes: >
      Gold audit 2026-07-07: original 2026 Item 1 chunk is valid, but the
      2026/2025/2024 AMD product-brand chunks are more direct evidence because
      they explicitly name AMD Instinct accelerators. Intel/AMD competition
      chunks are useful context for the "x86 desktop CPU rival of Intel" hop,
      but they do not answer the product-line part by themselves.

  - id: T005
    query: "What political risks affect the home country of the leading pure-play semiconductor foundry?"
    type: geo_via_supplier
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["tsmc", "taiwan", "political risk"]
    gold_chunks:
      - NVDA_2025_Item_1_0008_a4407f7e
      - NVDA_2026_Item_1_0007_bf6a51b6
      - AMD_2025_Item_1_0009_c842eea0
      - AMD_2026_Item_1_0010_460dfa17
      - AMD_2025_Item_1A_0032_0a1cf7f3
      - AMD_2026_Item_1A_0032_c870df0c
      - NVDA_2024_Item_1A_0022_b1d57eb9
    gold_evidence_groups:
      foundry_identity:
        - NVDA_2025_Item_1_0008_a4407f7e
        - NVDA_2026_Item_1_0007_bf6a51b6
        - AMD_2025_Item_1_0009_c842eea0
        - AMD_2026_Item_1_0010_460dfa17
      taiwan_political_risk:
        - AMD_2025_Item_1A_0032_0a1cf7f3
        - AMD_2026_Item_1A_0032_c870df0c
        - NVDA_2024_Item_1A_0022_b1d57eb9
    answer_points:
      - TSMC is linked to Taiwan.
      - Taiwan-related geopolitical or regional instability risks are relevant.
    notes: >
      Verified against Neo4j on 2026-07-07. Treat this as a two-evidence
      multi-hop query: foundry_identity chunks establish TSMC as the relevant
      Taiwan Semiconductor Manufacturing foundry, while taiwan_political_risk
      chunks establish China/Taiwan geopolitical or restriction-related supply
      risks. QCOM/RMBS/INTC candidate chunks about generic political or
      international risk are useful context but not direct gold evidence.

  - id: T006
    query: "Which Asian semiconductor manufacturer supplies wafers to NVIDIA's GPU production?"
    type: supplier_via_company
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["nvidia", "tsmc", "samsung", "semiconductor wafers"]
    gold_chunks:
      - NVDA_2024_Item_1_0007_bae70036
      - NVDA_2025_Item_1_0008_a4407f7e
      - NVDA_2026_Item_1_0007_bf6a51b6
    gold_evidence_groups:
      wafer_foundry_supplier:
        - NVDA_2024_Item_1_0007_bae70036
        - NVDA_2025_Item_1_0008_a4407f7e
        - NVDA_2026_Item_1_0007_bf6a51b6
    answer_points:
      - NVIDIA relies on external manufacturing/supply partners.
      - TSMC and Samsung are named foundries used to produce NVIDIA semiconductor wafers.
    notes: >
      Verified against Neo4j on 2026-07-07. These chunks directly state that
      NVIDIA uses foundries such as Taiwan Semiconductor Manufacturing Company
      Limited (TSMC) and Samsung Electronics to produce semiconductor wafers.
      SK Hynix and Micron appear in the same passages as memory suppliers, not
      wafer foundry suppliers, so they are not direct gold entities for this
      query.

  - id: T007
    query: "What graphics product line does AMD offer to compete with NVIDIA's RTX series?"
    type: competitor_product
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["amd", "nvidia", "radeon", "geforce rtx"]
    gold_chunks:
      - AMD_2024_Item_1_0009_01379c5a
      - AMD_2025_Item_1_0006_551768e4
      - AMD_2026_Item_1_0007_f252541b
      - AMD_2024_Item_1_0011_49024c2d
      - AMD_2025_Item_1_0009_c842eea0
      - AMD_2026_Item_1_0010_460dfa17
      - NVDA_2024_Item_1_0003_59fa75a8
      - NVDA_2025_Item_1_0003_ccc9ed65
      - NVDA_2026_Item_1_0003_0297d539
    gold_evidence_groups:
      amd_radeon_product_line:
        - AMD_2024_Item_1_0009_01379c5a
        - AMD_2025_Item_1_0006_551768e4
        - AMD_2026_Item_1_0007_f252541b
      amd_nvidia_graphics_competition:
        - AMD_2024_Item_1_0011_49024c2d
        - AMD_2025_Item_1_0009_c842eea0
        - AMD_2026_Item_1_0010_460dfa17
      nvidia_rtx_product_reference:
        - NVDA_2024_Item_1_0003_59fa75a8
        - NVDA_2025_Item_1_0003_ccc9ed65
        - NVDA_2026_Item_1_0003_0297d539
    answer_points:
      - AMD's graphics product line is Radeon.
      - The question requires a competitor-to-product hop.
    notes: >
      Verified against Neo4j on 2026-07-07. The AMD Radeon group states that
      AMD offers AMD Radeon graphics as its consumer graphics product brand.
      The competition group states that NVIDIA is a principal competitor in
      discrete graphics. The NVIDIA RTX group anchors the comparison target
      by stating that NVIDIA produces GeForce RTX / NVIDIA RTX products.

