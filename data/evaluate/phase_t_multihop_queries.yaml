      - NVDA_2026_Item_7_0001_485abbd3
      - NVDA_2025_Item_7_0002_b40db6b2
      - NVDA_2024_Item_1_0007_bae70036
      - NVDA_2025_Item_1_0008_a4407f7e
      - NVDA_2026_Item_1_0007_bf6a51b6
      - MU_2024_Item_1_0001_90ffbd18
      - MU_2025_Item_1_0001_b64486b7
      - MU_2024_Item_1_0003_acd8d0ff
    gold_evidence_groups:
      h200_nvidia_anchor:
        - NVDA_2026_Item_1_0009_8c403127
        - NVDA_2026_Item_1A_0022_3d4f4d9b
        - NVDA_2026_Item_7_0001_485abbd3
        - NVDA_2025_Item_7_0002_b40db6b2
      nvidia_memory_suppliers:
        - NVDA_2024_Item_1_0007_bae70036
        - NVDA_2025_Item_1_0008_a4407f7e
        - NVDA_2026_Item_1_0007_bf6a51b6
      micron_hbm_context:
        - MU_2024_Item_1_0001_90ffbd18
        - MU_2025_Item_1_0001_b64486b7
        - MU_2024_Item_1_0003_acd8d0ff
    answer_points:
      - H200 is associated with NVIDIA data center accelerator products.
      - NVIDIA discloses memory suppliers such as Micron, SK Hynix, and Samsung.
      - Current 10-K evidence does not directly prove which supplier provides the HBM used in H200.
    notes: >
      Gold audit 2026-07-08: scored as an inference-ambiguous multi-hop query.
      H200 chunks establish the NVIDIA product anchor, NVIDIA Item 1 chunks
      name Micron, SK Hynix, and Samsung as memory suppliers, and Micron chunks
      establish HBM/high-bandwidth memory context. The audited 10-K chunks do
      not directly prove that a specific supplier provides the HBM used in H200,
      so this should be interpreted as supplier-candidate evidence rather than
      a direct H200 bill-of-materials fact.

