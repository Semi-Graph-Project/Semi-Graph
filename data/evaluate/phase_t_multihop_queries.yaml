  - id: T015
    query: "What is the relationship between KLA yield improvement tools and downstream AMD gross margin risk?"
    type: graph_multihop
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["kla", "tsmc", "amd", "failure to achieve expected manufacturing yields", "gross margin"]
    gold_chunks:
      - KLAC_2023_Item_1_0000_849299a1
      - AMD_2025_Item_1A_0011_10eec6d1
      - AMD_2025_Item_1A_0009_57657610
      - AMD_2024_Item_1A_0008_027b0f68
      - AMD_2024_Item_1A_0011_fbb67bc3
    gold_evidence_groups:
      kla_yield_improvement_tools:
        - KLAC_2023_Item_1_0000_849299a1
      amd_yield_gross_margin_risk:
        - AMD_2025_Item_1A_0011_10eec6d1
        - AMD_2025_Item_1A_0009_57657610
        - AMD_2024_Item_1A_0008_027b0f68
        - AMD_2024_Item_1A_0011_fbb67bc3
    answer_points:
      - KLA tools support process control/yield improvement.
      - AMD can be affected by foundry yield/cost/margin risks.
    notes: >
      Gold audit 2026-07-08: scored as proxy multi-hop evidence. KLA chunks
      establish process control/yield improvement tools, while AMD chunks establish
      that manufacturing yield problems can raise unit costs and hurt gross margin.
      The evidence does not prove a direct KLA-to-AMD supplier relationship.
      Neo4j entity audit 2026-07-08: use the concrete entity name "failure to
      achieve expected manufacturing yields" instead of broad "yield" because
      the corpus stores yield risk as specific manufacturing-yield entities.
