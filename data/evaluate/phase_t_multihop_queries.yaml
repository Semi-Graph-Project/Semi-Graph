  - id: T017
    query: "Which Taiwanese contract chipmaker fabricates AMD's processors?"
    type: supplier_via_company
    gold_tools: ["graph", "hybrid"]
    gold_entities: ["amd", "tsmc"]
    gold_chunks:
      - AMD_2024_Item_1A_0007_2f2587e1
