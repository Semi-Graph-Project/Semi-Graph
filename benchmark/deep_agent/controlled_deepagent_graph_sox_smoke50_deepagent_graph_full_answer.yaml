- id: FRKG357
  mode: full_answer
  answer_audit_enabled: false
  query: How do Intel's and NVIDIA's disclosures about non-recurring charges and benefits within their 'All Other' segments
    reflect differences in their corporate expense allocation strategies?
  gold_chunks:
  - INTC_10k_2024.pdf::page_71::chunk_1
  - NVDA_10k_2024.pdf::page_78::chunk_1
  top_chunk_ids:
