  answer_points:
  - In 2022, TXN's Other segment reported restructuring charges of $257 million (Chunk 1). The company's segment reporting
    structure explicitly states that the Other segment includes restructuring charges as part of corporate-level financial
    evaluations (Chunk 2). This structural relationship means these charges directly affect consolidated financial metrics,
    even as the Embedded Processing segment contributed 16% of TXN's total revenue in 2024 (Chunk 3). The combined view shows
    how non-operational costs in one segment create financial headwinds that must be evaluated alongside revenue-generating
    segment performance across reporting periods.
  final_answer: The 2022 charge impact was $257 million. If the supplied 2022 and 2024 restructuring lines are combined, the
    inferred cross-year net is $257 million + (-$124 million) = $133 million [TXN_10k_2024.pdf::page_31::chunk_3] [TXN_10k_2024.pdf::page_30::chunk_2].
    The historical 2022 restructuring charge was $257 million, reported in Other and included in TXN's total financial results
    [TXN_10k_2024.pdf::page_31::chunk_3]. [TXN_10k_2023.pdf::page_25::chunk_2] TXN presents these charges in Other for reporting,
    while excluding them from the CODM's evaluation of reportable-segment performance and resource allocation [TXN_10k_2024.pdf::page_30::chunk_1].
    [TXN_10k_2024.pdf::page_4::chunk_1] Embedded Processing contributed $2,533 million in 2024 revenue. Using the segment-table
    total, $2,533 million ÷ $15,641 million × 100 = approximately 16.19%, consistent with TXN's stated 'about 16%' [TXN_10k_2024.pdf::page_30::chunk_2]
    [TXN_10k_2024.pdf::page_4::chunk_1].
