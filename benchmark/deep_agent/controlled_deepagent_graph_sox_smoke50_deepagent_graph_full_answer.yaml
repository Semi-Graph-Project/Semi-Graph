  query: How does CDP's role in managing environmental impacts influence the structure of corporate infrastructure and support
    cost reporting in Intel's 'All Other' segment, and how does this compare to NVIDIA's treatment of similar costs in its
    'All Other' category?
  gold_chunks:
  - INTC_10k_2024.pdf::page_102::chunk_2
  - INTC_10k_2024.pdf::page_70::chunk_1
