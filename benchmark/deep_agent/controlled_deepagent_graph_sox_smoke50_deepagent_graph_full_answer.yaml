  query: What was the percentage decrease in revenue and change in operating income for Intel's Network and Edge segment from
    2022 to 2023, and how do these changes reflect the impact of the organizational restructuring announced in 2023?
  gold_chunks:
  - INTC_10k_2023.pdf::page_87::chunk_1
  - INTC_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids:
  - INTC_10k_2023.pdf::page_88::chunk_2
