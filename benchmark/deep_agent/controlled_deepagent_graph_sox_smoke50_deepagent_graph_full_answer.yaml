- id: FRKG279
  mode: full_answer
  answer_audit_enabled: false
  query: How did the Network and Edge segment's operating loss in 2023 contribute to Intel's total operating income, given
    its unchanged asset balance and the historical tax settlements with authorities?
  gold_chunks:
  - INTC_10k_2022.pdf::page_92::chunk_2
  - INTC_10k_2023.pdf::page_97::chunk_2
  - INTC_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids:
