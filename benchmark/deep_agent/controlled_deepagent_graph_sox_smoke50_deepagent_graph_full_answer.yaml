    $33.2 billion for the year (Chunk 3). Customer incentive arrangements, including rebates and cost reimbursements, reduced
    this revenue and were recorded as reductions to accounts receivable or as other current liabilities (Chunk 3). CEO Cristiano
    R. Amon, as principal executive officer (Chunk 1), attests to the accuracy of these disclosures, establishing accountability
    for the financial reporting that links segment revenue growth to liability impacts through incentive programs.
  final_answer: QCT equipment and services revenue increased by $2.7 billion in fiscal 2024 versus 2023; QCT recorded fiscal
    2024 revenue of $33.2 billion. [QCOM_10k_2023.pdf::page_41::chunk_3] [QCOM_10k_2024.pdf::page_59::chunk_1] The $2.7 billion
    QCT increase is reported under an accounting policy that reduces revenue for customer incentives when the related revenue
    is earned. Accrued incentives may be presented in other current liabilities when Qualcomm lacks the applicable offset
    treatment; otherwise, they reduce accounts receivable. [QCOM_10k_2024.pdf::page_59::chunk_1] [QCOM_10k_2024.pdf::page_69::chunk_1]
