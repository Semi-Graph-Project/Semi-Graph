- id: FRKG240
  mode: full_answer
  answer_audit_enabled: false
  query: How did the increase in Mobileye's research and development expenditures and operating costs in 2023 affect its operating
    income compared to 2022, and what was the resulting impact on Intel's total operating income?
  gold_chunks:
  - INTC_10k_2024.pdf::page_24::chunk_1
  - INTC_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids:
