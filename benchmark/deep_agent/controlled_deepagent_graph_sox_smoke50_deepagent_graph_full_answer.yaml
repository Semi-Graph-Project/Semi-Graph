  - INTC_10k_2024.pdf::page_24::chunk_1
  answer_points:
  - Mobileye's research and development expenditures and operating costs increased by $123 million in 2023 (Chunk 1), which
    directly reduced its operating income from $690 million in 2022 to $664 million in 2023 (Chunk 2), a decrease of $26 million.
    This decline in Mobileye's operating income contributed to Intel's total operating income falling from $2,334 million
    in 2022 to $93 million in 2023 (Chunk 2), highlighting how segment-level cost increases cascaded into the company's overall
    profitability.
  final_answer: Mobileye's operating income declined by $26 million, from $690 million in 2022 to $664 million in 2023. Intel
    also disclosed that higher Mobileye research and development expenditures and operating costs were a primary driver of
    the $123 million increase in all other operating expenses, although the evidence does not isolate their precise effect
    on Mobileye's income. [INTC_10k_2023.pdf::page_88::chunk_2] [INTC_10k_2024.pdf::page_24::chunk_1] Intel's total operating
    income decreased by $2.241 billion, from $2.334 billion in 2022 to $93 million in 2023. The supplied evidence does not
    quantify how much of this total decline was specifically attributable to Mobileye's higher costs. [INTC_10k_2023.pdf::page_88::chunk_2]
