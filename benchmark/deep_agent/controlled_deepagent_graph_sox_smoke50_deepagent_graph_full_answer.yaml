- id: FRKG104
  mode: full_answer
  answer_audit_enabled: false
  query: What was the dollar increase in Intel's consolidated share of Mobileye's operating income between 2022 and 2023,
    and how did this compare to the overall decline in Intel's total operating income during the same period?
  gold_chunks:
  - INTC_10k_2023.pdf::page_89::chunk_2
  - INTC_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids:
  - INTC_10k_2023.pdf::page_88::chunk_2
  answer_points:
  - Intel's ownership stake in Mobileye increased from 6% (2022) to 12% (2023) (Chunk 1), while Mobileye's operating income
    decreased from $690M to $664M (Chunk 2). In 2022, Intel consolidated 6% × $690M = $41.4M of Mobileye's operating income.
    In 2023, this increased to 12% × $664M = $79.68M. This represents a $38.28M increase in Intel's consolidated share. However,
    Intel's total operating income plummeted from $2,334M to $93M, a $2,241M decline. The $38.28M gain from Mobileye was insufficient
    to offset losses in other segments, highlighting how partial stake increases cannot counterbalance broader operational
    challenges.
  final_answer: There was no dollar increase. Intel's Mobileye operating income decreased by $26 million, from $690 million
    in 2022 to $664 million in 2023. [INTC_10k_2023.pdf::page_88::chunk_2] Intel's total operating income declined by $2.241
    billion, from $2.334 billion to $93 million. Thus, the overall decline was $2.215 billion larger than Mobileye's $26 million
    decrease. [INTC_10k_2023.pdf::page_88::chunk_2]
