  - INTC_10k_2023.pdf::page_87::chunk_1
  - INTC_10k_2022.pdf::page_92::chunk_2
  answer_points:
  - The Network and Edge segment's 2023 operating loss of $482 million (Chunk 3) directly reduced Intel's total operating
    income to $93 million, as segment losses offset profits from other divisions. Despite maintaining a stable asset balance
    of $2,809 million (Chunk 2), the segment's declining revenue (from $7,665 million in 2021 to $5,774 million in 2023) exacerbated
    its negative contribution. Historical tax settlements with authorities (-$25 million in 2021 and -$142 million in 2020)
    (Chunk 1) reflect resolved liabilities but did not mitigate the segment's operational challenges, highlighting how structural
    business performance, not tax adjustments, drove the final total operating income.
  final_answer: The Network and Edge loss reduced Intel's total operating income by $482 million. The other segments collectively
    offset that loss with a net $575 million, leaving Intel with $93 million of total operating income. [INTC_10k_2023.pdf::page_88::chunk_2]
    The reported Network and Edge balance remained unchanged at $2,809 million, but the filing says segment assets are not
    used for discrete segment evaluation. [INTC_10k_2023.pdf::page_97::chunk_2] [INTC_10k_2023.pdf::page_87::chunk_1] The
    historical settlements were reductions in unrecognized tax benefits, but Intel does not allocate taxes to segments; therefore,
    the evidence does not support attributing those settlements to Network and Edge's 2023 operating loss or to total operating
    income. [INTC_10k_2022.pdf::page_92::chunk_2] [INTC_10k_2023.pdf::page_87::chunk_1]
