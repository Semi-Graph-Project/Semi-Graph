  answer_points:
  - In 2022, Mobileye's non-controlling interest was $989 million at 6% ownership, equating to $164.83 million per percentage
    point (Chunk 2). In 2023, this increased to $1,838 million at 12% ownership, equating to $153.17 million per percentage
    point. The percentage change in value per point was ($153.17 - $164.83)/$164.83 = -7.07%. This decline suggests that while
    Intel increased its ownership stake (from 6% to 12%) in Mobileye (Chunk 1), the valuation per percentage point decreased,
    potentially indicating equity dilution or lower asset valuations in Mobileye relative to Intel's consolidated financial
    position.
  final_answer: The value per percentage point decreased approximately 7.08%, from $164.833 million to $153.167 million [INTC_10k_2023.pdf::page_89::chunk_2].
    The lower per-point value suggests a lower implied Mobileye valuation per ownership percentage, despite the larger absolute
    non-controlling interest. On a proportional carrying-value basis, Intel's inferred stake value fell about 13.01%; this
    is not a stated fair-market valuation. Intel's 2023 sale of 5% at $42 per share provides a separate transaction benchmark
    [INTC_10k_2023.pdf::page_89::chunk_2] [INTC_10k_2024.pdf::page_75::chunk_1].
