- number: 2
  id: FRKG009
  query: What percentage of Texas Instruments' 2022 total revenue was represented by restructuring charges disclosed in the
    Other segment, and how does the company's segment reporting structure explain the separation of these charges from operating
    segments like Embedded Processing?
  selected_chunk_ids:
  - TXN_10k_2022.pdf::page_54::chunk_1
  - TXN_10k_2024.pdf::page_31::chunk_3
  - TXN_10k_2023.pdf::page_4::chunk_1
  - TXN_10k_2022.pdf::page_33::chunk_2
  - TXN_10k_2024.pdf::page_30::chunk_1
  final_answer: "{\n  \"parts\": [\n    {\n      \"requested_part\": \"What percentage of Texas Instruments' 2022 total revenue\
    \ was represented by restructuring charges disclosed in the Other segment?\",\n      \"supported_facts\": [\n        {\n\
    \          {\n            \"claim\": \"Restructuring charges/other were $257 million in the Other segment for the year\
    \ ended December 31, 2022.\",\n            \"evidence_ids\": [\"TXN_10k_2024.pdf::page_31::chunk_3\"]\n          }\n \
    \       },\n        {\n          {\n            \"claim\": \"Total revenue for the year ended December 31, 2022 was $20,028\
    \ million.\",\n            \"evidence_ids\": [\"TXN_10k_2024.pdf::page_31::chunk_3\"]\n          }\n        }\n      ],\n\
    \      \"missing_information\": null,\n      \"answer\": \"The restructuring charges/other in the Other segment represented\
    \ approximately 1.28% of Texas Instruments' 2022 total revenue. This is calculated as ($257 / $20,028) * 100 = 1.28%.\
    \ [TXN_10k_2024.pdf::page_31::chunk_3]\"\n    },\n    {\n      \"requested_part\": \"How does the company's segment reporting\
    \ structure explain the separation of these charges from operating segments like Embedded Processing?\",\n      \"supported_facts\"\
    : [\n        {\n          {\n            \"claim\": \"Texas Instruments has two reportable segments: Analog and Embedded\
    \ Processing.\",\n            \"evidence_ids\": [\"TXN_10k_2024.pdf::page_30::chunk_1\"]\n          }\n        },\n  \
    \      {\n          {\n            \"claim\": \"Other includes items that are not used in evaluating the results of or\
    \ in allocating resources to our segments, such as acquisition, integration and restructuring charges.\",\n          \
    \  \"evidence_ids\": [\"TXN_10k_2024.pdf::page_30::chunk_1\"]\n          }\n        }\n      ],\n      \"missing_information\"\
    : null,\n      \"answer\": \"The company's segment reporting structure separates restructuring charges into the Other\
    \ segment because these charges are not used in evaluating the results of or in allocating resources to the Analog and\
    \ Embedded Processing segments. They are considered corporate-level items and are included in the Other segment to reflect\
    \ the remaining business activities that do not meet the quantitative thresholds for individually reportable segments.\
    \ [TXN_10k_2024.pdf::page_30::chunk_1]\"\n    }\n  ],\n  \"final_answer\": \"In 2022, restructuring charges/other in the\
    \ Other segment represented approximately 1.28% of Texas Instruments' total revenue. These charges are separated from\
    \ operating segments like Embedded Processing because they are considered corporate-level items and are included in the\
    \ Other segment to reflect the remaining business activities that do not meet the quantitative thresholds for individually\
    \ reportable segments. [TXN_10k_2024.pdf::page_31::chunk_3, TXN_10k_2024.pdf::page_30::chunk_1]\"\n}"
  citations:
  - TXN_10k_2024.pdf::page_31::chunk_3
  - TXN_10k_2024.pdf::page_30::chunk_1
  invalid_citations:
