- number: 3
  id: FRKG010
  query: What was the total operating profit contribution from the Embedded Processing and Other segments in 2022 compared
    to 2023, considering that the Other segment includes restructuring charges and gains/losses from other activities as disclosed
    in the prior year's filing?
  selected_chunk_ids:
  - TXN_10k_2022.pdf::page_6::chunk_1
  - TXN_10k_2022.pdf::page_33::chunk_2
  - TXN_10k_2024.pdf::page_31::chunk_3
  - TXN_10k_2024.pdf::page_31::chunk_1
  - TXN_10k_2024.pdf::page_31::chunk_1
  final_answer: The Embedded Processing segment generated $1,253 million of operating profit in 2022. [TXN_10k_2022.pdf::page_33::chunk_2]
    The Other segment generated $528 million of operating profit in 2022. [TXN_10k_2022.pdf::page_33::chunk_2] In 2022, the
    Embedded Processing segment generated $1,253 million and the Other segment generated $528 million. In 2023, the Embedded
    Processing segment generated $1,008 million and the Other segment generated $502 million. [TXN_10k_2022.pdf::page_33::chunk_2]
    [TXN_10k_2024.pdf::page_31::chunk_1]
  citations:
  - TXN_10k_2022.pdf::page_33::chunk_2
  - TXN_10k_2024.pdf::page_31::chunk_1
