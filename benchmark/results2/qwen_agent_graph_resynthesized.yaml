- number: 4
  id: FRKG011
  query: What was the change in AMD's deferred tax liability related to acquired intangibles from 2022 to 2023, and how might
    the company's increasing compliance costs associated with SEC regulations influence this financial metric?
  selected_chunk_ids:
  - AMD_10k_2023.pdf::page_88::chunk_2
  - AMD_10k_2023.pdf::page_36::chunk_1
  - AMD_10k_2023.pdf::page_88::chunk_2
  final_answer: The change in AMD's deferred tax liability related to acquired intangibles from 2022 to 2023 was a decrease
    of $326 million. [AMD_10k_2023.pdf::page_88::chunk_2] Increasing compliance costs associated with SEC regulations, such
    as conflict minerals reporting requirements and new policies, could potentially increase AMD's overall compliance expenses.
    These costs might indirectly affect the company's financial metrics by impacting operational efficiency and resource allocation.
    However, there is no direct evidence linking these compliance costs to changes in deferred tax liabilities specifically
    related to acquired intangibles. [AMD_10k_2023.pdf::page_36::chunk_1]
  citations:
