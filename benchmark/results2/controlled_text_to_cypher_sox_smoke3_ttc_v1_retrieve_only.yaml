    calls_with_usage: 1
    status: complete
  generated_cypher: "MATCH (c:Chunk)\nWHERE c.fiscal_year = 2024\n  AND c.filing_type = '10-K'\n  AND c.ticker IN ['INTC',\
    \ 'NVDA']\n  AND (\n    (\n      toLower(c.text) CONTAINS 'all other'\n      AND (\n        toLower(c.text) CONTAINS 'stock-based\
    \ compensation'\n        OR toLower(c.text) CONTAINS 'stock based compensation'\n        OR toLower(c.text) CONTAINS 'share-based\
    \ compensation'\n      )\n    )\n    OR (\n      toLower(c.text) CONTAINS 'all other'\n      AND toLower(c.text) CONTAINS\
