- id: FRKG082
  mode: full_answer
  answer_audit_enabled: false
  query: What was the impact of the All Other segment's operating loss in 2023 on Intel's total operating income, and how
    does the segment's composition of non-reportable businesses and intersegment allocations contribute to this financial
    outcome?
  gold_chunks:
  - INTC_10k_2024.pdf::page_71::chunk_1
  - INTC_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids:
  - INTC_10k_2023.pdf::page_88::chunk_2
  - INTC_10k_2023.pdf::page_87::chunk_1
  answer_points:
  - The All Other segment reported an operating loss of $5,597 million in 2023 (Chunk 2), which significantly reduced Intel's
    total operating income to just $93 million. This segment's composition—including non-reportable businesses like Altera
    and Mobileye, startup initiatives, and intersegment revenue/expenses (Chunk 1)—means its financial performance reflects
    both unprofitable strategic ventures and allocated costs from corporate functions. The intersegment allocations (e.g.,
    sales/marketing expenses to Intel Products segments and unallocated corporate costs) amplify its negative contribution,
    demonstrating how Intel's internal cost distribution and underperforming subsidiaries directly erode consolidated profitability.
  final_answer: All Other was a $5,597 million drag on Intel's 2023 operating results. Because total operating income was
    only $93 million, the other segments collectively imply $5,690 million of operating income before the All Other loss.
    [INTC_10k_2023.pdf::page_88::chunk_2] All Other is a residual category combining non-reportable and start-up businesses
    with divested-business results, restructuring, unallocated employee and impairment costs, and acquisition-related charges.
    Intel also allocates shared functional expenses to segments, although costs recorded in one segment may benefit another.
    These features can concentrate corporate, legacy, and business-development costs in All Other, but the supplied evidence
    does not quantify that effect. [INTC_10k_2023.pdf::page_87::chunk_1]
