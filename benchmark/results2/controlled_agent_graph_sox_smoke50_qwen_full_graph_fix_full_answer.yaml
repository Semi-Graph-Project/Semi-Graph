- id: FRKG009
  mode: full_answer
  answer_audit_enabled: false
  query: What percentage of Texas Instruments' 2022 total revenue was represented by restructuring charges disclosed in the
    Other segment, and how does the company's segment reporting structure explain the separation of these charges from operating
    segments like Embedded Processing?
  gold_chunks:
  - TXN_10k_2024.pdf::page_31::chunk_3
  - TXN_10k_2023.pdf::page_30::chunk_1
  - TXN_10k_2024.pdf::page_4::chunk_1
  top_chunk_ids:
  - TXN_10k_2022.pdf::page_54::chunk_1
  - TXN_10k_2024.pdf::page_31::chunk_3
  - TXN_10k_2023.pdf::page_4::chunk_1
  - TXN_10k_2022.pdf::page_33::chunk_2
  - TXN_10k_2024.pdf::page_30::chunk_1
  answer_points:
  - In 2022, restructuring charges in the Other segment amounted to $257 million (Chunk 1), representing 1.28% of total revenue
    ($257M / $20,028M). Texas Instruments' segment reporting structure (Chunk 2) explains that restructuring charges are classified
    as corporate-level items in the Other segment, which are not allocated to operating segments like Embedded Processing.
    This separation reflects how management evaluates segment performance by excluding non-operational corporate expenses
    (Chunk 3 confirms Embedded Processing is a distinct operating segment with 16% revenue contribution in 2024, emphasizing
    its structural independence from corporate charges).
  final_answer: The restructuring charges/other in the Other segment for 2022 were $257 million, representing approximately
    14.75% of the Other segment's revenue ($257 / $1,408 * 100 = 18.25%). However, without the total revenue for 2022, the
    exact percentage of the total revenue cannot be calculated. [TXN_10k_2022.pdf::page_54::chunk_1] [TXN_10k_2023.pdf::page_4::chunk_1]
    [TXN_10k_2024.pdf::page_31::chunk_3] Texas Instruments separates restructuring charges and other corporate-level items
    into the Other segment because they are not used in evaluating the results of or in allocating resources to the operating
    segments. This means that these charges are not directly tied to the performance of the Analog or Embedded Processing
    segments, hence their separation. [TXN_10k_2024.pdf::page_30::chunk_1] [TXN_10k_2023.pdf::page_4::chunk_1]
