        vision and machine learning-based sensing, mapping and localization, driving policy, and active sensors in development.
        Mobileye''s unique assets in ADAS allow for building a scalable self-driving stack that meets the requirements for
        both Robotaxi and consumer level autonomy. Our customers and strategic partners include major global OEMs, Tier 1
        automotive system integrators, and public transportation operators. ## Key Developments - ■ We achieved record revenue
        in 2021 as global vehicle production improved amid recovery from the economic impacts of COVID-19. Our EyeQ SoC volume
        grew 42% and we expect to see additional growth in the adoption of enhanced ADAS technologies. We have shipped over
        100 million chips to date, including 28 million EyeQ SoCs in 2021. - ■ We secured a record 41 new ADAS design wins,
        including deals with major OEMs such as Toyota, VW, BMW, Nissan, Honda, and PSA Group. We are currently active in
        71 production programs across over 30 OEMs. 1 - ■ We launched our SAE L4 SDS, Mobileye Drive™, and secured multiple
        collaborations for commercial use, including with Udelv for autonomous cargo delivery, and with Transdev for selfdriving
        mobility services. We also achieved our first consumer L4 design win with Geely. - ■ We unveiled the Mobileye Robotaxi,
        a production-grade self-driving electric vehicle, with mobility rider services and MaaS platform, as well as mobility
        intelligence, tele-operations and data services by Moovit. Through the partnership with SIXT, Robotaxi services will
        begin in Germany in 2022, along with the already announced Robotaxi services in Tel Aviv. - ■ In December 2021, we
        announced our intention to take Mobileye public in the US via an IPO of newly issued Mobileye stock. Intel expects
        to retain majority ownership of Mobileye following the completion of the IPO. ## 5-Year Trends 2 ## Market and Business
        Overview ## Market Trends and Strategy While the vehicle industry shows recovery from the COVID-19 pandemic with approximately
        2% growth year over year, production is still roughly 15% below 2019 levels. We expect ADAS volume to overcome the
        COVID-19 effects faster than overall global vehicle production, given the significant growth shown in 2021. We anticipate
        long-term ADAS growth from a strong build-up in L1-L2 ADAS fitment rates, increasing the number of vehicles that will
        have basic ADAS features from the factory. In addition, we expect increased demand for new generations of cloud-enhanced
        ADAS as OEMs continue to look to boost current L2 solutions by improving system fidelity, availability, and performance.
        A crucial building block for L4 autonomy, our REM highdefinition maps with constant updates, global coverage, and
        crowd-based semantics provide a unique value proposition for enhanced L2 systems. We see great traction from leading
        OEMs (including VW and Ford, as recently announced) as REM-based enhancements can be achieved based on economical
        configuration. 3 We believe the future of autonomous driving will unfold in two phases: commercial services like Robotaxi
        and cargo, followed by series-production passenger car consumer AVs. We expect consumer AVs to materialize only after
        the Robotaxi industry deploys and matures. The main inhibitors of a mass market product offering of consumer AV are
        the cost of AV technology, ability to scale at a low cost, regulatory framework, public acceptance, and the ability
        to scale geographically. Thus, we see the Robotaxi phase as a necessary corridor to consumer AV. Because of our scalable
        approach, Mobileye is well-positioned to play a significant role in both the Robotaxi market and the future consumer
        AV market. This is driven by three elements in our strategy: lean compute enabled by the tight co-design of hardware
        and software, REM crowdsourced maps that provide unparalleled global coverage and constant updates, and development
        of high-resolution imaging radars to reduce the use of costly LiDAR sensors. - This refers to the total number of
        production programs with active project managers. Intel''s definition of program is included in "Key Terms" within
