        by conditioning them, amplifying them and often conv erting them to a stream of digital data that can be processed
        by other semiconductors, such as embedded processors. Analog semiconductors are also used to manage power in all electronic
        equipment by conv erting, distributing, storing, discharging, isolating and measuring electrical energy, whether the
        equipment is plugged into a wall or using a battery. Our Analog segment consists of two major product lines: Power
