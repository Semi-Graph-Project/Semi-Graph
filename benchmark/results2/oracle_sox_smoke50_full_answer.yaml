    - chunk_id: TXN_10k_2022.pdf::page_6::chunk_1
      text: 'Sales of Embedded Processing products generated about 17% of our revenue in 2021. Our Embedded Processing segment
        includes microcontrollers, digital signal processors (DSPs) and applications processors. Microcontrollers are self-contained
        systems with a processor core, memory and peripherals that are designed to control a set of specific tasks for electronic
        equipment. DSPs perform mathematical computations almost instantaneously to process or improve digital data. Applications
        processors are designed for specific computing activity. ## Other We report the results of our remaining business
        activities in Other, which includes operating segments that do not meet the quantitative thresholds for individually
        reportable segments and cannot be aggregated with other operating segments. Other generated $1.25 billion of revenue
        in 2021 and includes revenue from DLP products (primarily used to project high-definition images), calculators and
        certain custom semiconductors known as application-specific integrated circuits (ASICs). ® In Other, we also include
        items that are not used in evaluating the results of or in allocating resources to our segments. Examples of these
        items include acquisition, integration and restructuring charges, as well as certain corporate-level items, such as
        litigation expenses, environmental costs and gains and losses from other activities, including asset dispositions.'
