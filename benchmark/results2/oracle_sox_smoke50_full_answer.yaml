        the amount of taxes payable or refundable for the current year and the deferred tax assets and liabilities for future
        tax consequences related to ev ents that hav e been recognized in the financial statements or tax returns. We record
        a v aluation allowance when it is more likely than not that some or all of the deferred tax assets will not be realized.
        ## Other assessed taxes Some transactions require us to collect taxes such as sales, v alue-added and excise taxes
        from our customers. These transactions are presented in our Consolidated Statements of Income on a net (excluded from
