        from which final results may v ary. ## Significant accounting policies and practices ## Revenue recognition We generate
        revenue primarily from the sale of semiconductor products, either directly to a customer or to a distributor, and
        recognize rev enue when control is transferred. Control is considered transferred when title and risk of loss pass,
        when the customer becomes obligated to pay and, where required, when the customer has accepted the products. This
        transfer generally occurs at a point in time upon shipment or deliv ery to the customer or distributor, depending
        upon the terms of the sales order. Payment for sales to customers and distributors is generally due on our standard
        commercial terms. For sales to distributors, payment is not contingent upon resale of the products. Revenue from sales
        of our products that are subject to inv entory consignment agreements is recognized at a point in time, when the customer
        or distributor pulls product from consignment inv entory that we store at designated locations. Deliv ery and transfer
        of control occur at that point, when title and risk of loss transfers and the customer or distributor becomes obligated
        to pay for the products pulled from inv entory. Until the products are pulled for use or sale by the customer or distributor,
        we retain control ov er the products'' disposition, including the right to pull back or relocate the products. The
        rev enue recognized is adjusted based on allowances, which are prepared on a portfolio basis using a most likely amount
        methodology based on analysis of historical data and contractual terms. These allowances, which are not material,
        generally include adjustments for pricing arrangements, product returns and incentiv es. We recognize shipping fees
        receiv ed from customers, if any, in rev enue. We include the related shipping and handling costs in cost of rev enue.
