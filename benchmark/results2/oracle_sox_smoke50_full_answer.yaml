    (Chunk 3). During the same period, its asset base decreased by $34 million (from $2,654 million in 2019 to $2,622 million
    in 2020) (Chunk 2), potentially reflecting inventory adjustments or reallocation of resources. The auditor evaluated inventory
    valuation assumptions, including demand forecasts and net realizable value, which directly impact both asset valuation
    (Chunk 1) and cost of goods sold—a key component of operating income (Chunk 3). This demonstrates how inventory management
    practices (validated by the auditor) and asset base adjustments interconnect to influence financial performance metrics.
  synthesis_input:
    original_query: What was the percentage change in the Programmable Solutions Group's operating income from 2020 to 2021,
      and how does this relate to the segment's asset adjustments and the auditor's evaluation of inventory valuation practices?
    accepted_chunks:
    - chunk_id: INTC_10k_2022.pdf::page_72::chunk_1
      text: '## Description of the Matter ## How We Addressed the Matter in Our Audit ## Inventory Valuation The Company''s
        net inventory totaled $10.8 billion as of December 25, 2021, representing 6.4% of total assets. As explained in "Note
        2: Accounting Policies" within the Consolidated Financial Statements, the Company computes inventory cost on a first-in,
        first-out basis, and applies judgment in determining saleability of products and the valuation of inventories. The
        Company assesses inventory at each reporting date in order to assert that it is recorded at net realizable value,
        giving consideration to, among other factors: whether the products have achieved the substantive engineering milestones
        to qualify for sale to customers; the determination of normal capacity levels in its manufacturing process to determine
        which manufacturing overhead costs can be included in the valuation of inventory; whether the product is valued at
        the lower of cost or net realizable value; and the estimation of excess and obsolete inventory or that which is not
        of saleable quality. Auditing management''s assessment of net realizable value for inventory was challenging because
        the determination of lower of cost or net realizable value and excess and obsolete inventory reserves is judgmental
        and considers a number of factors that are affected by market and economic conditions, such as customer forecasts,
        dynamic pricing environments, and industry supply and demand. Additionally, for certain new product launches there
        is limited historical data with which to evaluate forecasts. We evaluated and tested the design and operating effectiveness
        of the Company''s internal controls over the costing of inventory, the determination of whether inventory is of saleable
        quality, the calculation of lower of cost or net realizable value reserves including related estimated costs and selling
        prices, and the determination of demand forecasts and related application against on hand inventory. Our audit procedures
        included, among others, testing the significant assumptions (e.g., estimated product costs and selling prices, and
        product demand forecasts) and the underlying data used in management''s inventory valuation assessment. We compared
        the significant assumptions used by management to current industry and economic trends. We assessed whether there
        were any potential sources of contrary information, including historical forecast accuracy or history of significant
        revisions to previously recorded inventory valuation adjustments, and performed sensitivity analyses over significant
        assumptions to evaluate the changes in inventory valuation that would result from changes in the assumptions. /s/
        Ernst &amp; Young LLP We have served as the Company''s auditor since 1968. San Jose, California January 26, 2022 Auditor''s
        Reports'
