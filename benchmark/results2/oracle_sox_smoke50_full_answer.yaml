        embedded applications. ## Other We report the results of our remaining business activ ities in Other, which includes
        operating segments that do not meet the quantitativ e thresholds for indiv idually reportable segments and cannot
        be aggregated with other operating segments. Other generated $947 million of rev enue in 2024 and includes rev enue
        from DLP products (primarily used to project high-definition images), calculators and certain custom semiconductors
        known as applicationspecific integrated circuits (ASICs). ® In Other, we also include items that are not used in ev
