    - chunk_id: TXN_10k_2023.pdf::page_30::chunk_1
      text: '## Notes to financial statements ## 1. Description of business, including segment and geographic area information
        We design and manufacture semiconductors that we sell to electronics designers and manufacturers all over the world.
        We have two reportable segments, Analog and Embedded Processing, each of which represents groups of similar products
        that are combined on the basis of similar design and development requirements, product characteristics, manufacturing
        processes and distribution channels. Our segments also reflect how management allocates resources and measures results.
        - Analog semiconductors change real-world signals, such as sound, temperature, pressure or images, by conditioning
        them, amplifying them and often converting them to a stream of digital data that can be processed by other semiconductors,
        such as embedded processors. Analog semiconductors are also used to manage power in all electronic equipment by converting,
        distributing, storing, discharging, isolating and measuring electrical energy, whether the equipment is plugged into
        a wall or using a battery. Our Analog segment consists of two major product lines: Power and Signal Chain. - Embedded
        Processing products are the digital ''brains'' of many types of electronic equipment. They are designed to handle
        specific tasks and can be optimized for various combinations of performance, power and cost, depending on the application.
        We report the results of our remaining business activities in Other. Other includes operating segments that do not
        meet the quantitative thresholds for individually reportable segments and cannot be aggregated with other operating
        segments. Other includes DLP products, calculators and custom ASIC products. ® In Other, we also include items that
        are not used in evaluating the results of or in allocating resources to our segments. Examples of these items include
        acquisition, integration and restructuring charges (see Note 11); and certain corporate-level items, such as litigation
        expenses, environmental costs, insurance settlements, and gains and losses from other activities, including asset
        dispositions. We allocate the remainder of our expenses associated with corporate activities to our operating segments
        based on specific methodologies, such as percentage of operating expenses or headcount. Our centralized manufacturing
        and support organizations, such as facilities, procurement and logistics, provide support to our operating segments,
        including those in Other. Costs incurred by these organizations, including depreciation, are charged to the segments
        on a per-unit basis. Consequently, depreciation expense is not an independently identifiable component within the
        segments'' results and, therefore, is not provided. With the exception of goodwill, we do not identify or allocate
        assets by operating segment, nor does the chief operating decision maker evaluate operating segments using discrete
        asset information. We have no material intersegment revenue. The accounting policies of the segments are consistent
        with those described in the summary of significant accounting policies and practices.'
      ticker: TXN
      fiscal_year: 2023
      section: page_30
      source_file: TXN_10k_2023.pdf
      page_id: page_30
    - chunk_id: TXN_10k_2024.pdf::page_4::chunk_1
      text: 'Sales of Embedded Processing products generated about 16% of our rev enue in 2024. Our Embedded Processing segment
        includes microcontrollers, processors, wireless connectiv ity and radar products. Microcontrollers are self-contained
