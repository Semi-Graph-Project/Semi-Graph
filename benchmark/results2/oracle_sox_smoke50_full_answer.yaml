  mode: full_answer
  query: What was the percentage decrease in revenue and change in operating income for Intel's Network and Edge segment from
    2022 to 2023, and how do these changes reflect the impact of the organizational restructuring announced in 2023?
  gold_chunks: &id036
  - INTC_10k_2023.pdf::page_87::chunk_1
  - INTC_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids: *id036
  answer_points:
  - Intel's Network and Edge segment revenue decreased from $8,409 million in 2022 to $5,774 million in 2023, a 31.3% decline
    ((8,409 - 5,774)/8,409 * 100). Operating income shifted from $1,033 million profit in 2022 to a $482 million loss in 2023,
    representing a $1,515 million deterioration. This reflects the impact of the organizational restructuring announced in
    2023 (Chunk 1), which integrated AXG into other segments to reduce costs and accelerate scalability. However, the significant
    revenue drop and profitability shift suggest potential disruptions from the restructuring, including possible resource
    reallocation or market focus changes, directly affecting Network and Edge's financial performance (Chunk 2).
  synthesis_input:
    original_query: What was the percentage decrease in revenue and change in operating income for Intel's Network and Edge
      segment from 2022 to 2023, and how do these changes reflect the impact of the organizational restructuring announced
      in 2023?
    accepted_chunks:
    - chunk_id: INTC_10k_2023.pdf::page_87::chunk_1
      text: '## Leases Leases consist of real property and machinery and equipment. Our lease terms may include options to
        extend when it is reasonably certain that we will exercise such options. For leases for supplier capacity, we account
        for the lease and non-lease components as a single lease component. For all other leases, we account for the lease
        and non-lease components separately and do not include the non-lease components in our leased assets and corresponding
        liabilities. Payments on leases may be fixed or variable, and variable lease payments are based on output of the underlying
        leased assets. ## Loss Contingencies We are subject to loss contingencies, including various legal and regulatory
        proceedings, asserted and potential claims, liabilities related to repair or replacement of parts in connection with
        product defects, as well as product warranties and potential asset impairments that arise in the ordinary course of
        business and are subject to change, including due to sudden or rapid developments in proceedings or claims. An estimated
        loss from such contingencies is recognized as a charge to income if it is probable that a liability has been incurred
        and the amount of the loss can be reasonably estimated. We evaluate developments that could affect prior disclosures
        or previously accrued liabilities, and make adjustments as appropriate. Significant judgment is required to determine
        both likelihood of there being, and the estimated amount of, a loss related to such matters. If one or more of these
        matters were resolved against us for amounts in excess of management''s estimates of losses, our results of operations
        and financial condition could be materially adversely affected. ## Note 3 : Operating Segments We previously announced
        the organizational change to integrate AXG into CCG and DCAI. This change is intended to drive a more effective go-to-market
        capability and to accelerate the scale of these businesses, while also reducing costs. As a result, we modified our
        segment reporting in the first quarter of 2023 to align to this and certain other business reorganizations. All prior-period
        segment data has been retrospectively adjusted to reflect the way our CODM internally receives information and manages
        and monitors our operating segment performance starting in fiscal year 2023. We manage our business through the following
        operating segments: - Client Computing Group - Data Center and AI - Network and Edge - Mobileye - Intel Foundry Services
        We derive a substantial majority of our revenue from our principal products that incorporate various components and
        technologies, including a microprocessor and chipset, a stand-alone SoC, or a multichip package, which are based on
        Intel architecture. CCG, DCAI, and NEX are our reportable operating segments. Mobileye and IFS do not qualify as reportable
        operating segments; however, we have elected to disclose the results of these non-reportable operating segments. When
        we enter into federal contracts, they are aligned to the sponsoring operating segment. We have sales and marketing,
        manufacturing, engineering, finance, and administration groups. Expenses for these groups are generally allocated
        to the operating segments. We have an "all other" category that includes revenue, expenses, and charges such as: -
        results of operations from non-reportable segments not otherwise presented, and from start-up businesses that support
        our initiatives; - historical results of operations from divested businesses; - amounts included within restructuring
        and other charges; - employee benefits, compensation, impairment charges, and other expenses not allocated to the
        operating segments; and - acquisition-related costs, including amortization and any impairment of acquisition-related
        intangibles and goodwill. The CODM, who is our CEO, allocates resources to and assesses the performance of each operating
        segment using information about the operating segment''s revenue and operating income (loss). The CODM does not evaluate
        operating segments using discrete asset information, and we do not identify or allocate assets by operating segments.
        Based on the interchangeable nature of our manufacturing and assembly and test assets, most of the related depreciation
        expense is not directly identifiable within our operating segments, as it is included in overhead cost pools and subsequently
        absorbed into inventory as each product passes through our manufacturing process. Because our products are then sold
        across multiple operating segments, it is impracticable to determine the total depreciation expense included as a
        component of each operating segment''s operating income (loss) results. We do not allocate gains and losses from equity
        investments, interest and other income, share-based compensation, or taxes to our operating segments. Although the
        CODM uses operating income (loss) to evaluate the segments, operating costs included in one segment may benefit other
        segments. The accounting policies for segment reporting are the same as for Intel as a whole. Financial Statements
        Notes to Consolidated Financial Statements 85'
      ticker: INTC
      fiscal_year: 2023
      section: page_87
      source_file: INTC_10k_2023.pdf
      page_id: page_87
