- id: FRKG011
  mode: full_answer
  query: What was the change in AMD's deferred tax liability related to acquired intangibles from 2022 to 2023, and how might
    the company's increasing compliance costs associated with SEC regulations influence this financial metric?
  gold_chunks: &id004
  - AMD_10k_2023.pdf::page_36::chunk_1
  - AMD_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids: *id004
  answer_points:
  - AMD's deferred tax liability for acquired intangibles decreased by $326 million from 2022 ($3,430M) to 2023 ($3,104M).
    This decrease could be partially attributed to higher compliance costs linked to SEC regulations (e.g., conflict minerals
    reporting), which increase operating expenses and reduce taxable income. Lower taxable income reduces deferred tax liabilities
    over time, as these liabilities reflect future tax obligations tied to temporary differences in asset/liability valuations.
    The $46M increase in valuation allowances (from $2,078M to $2,124M) further suggests heightened uncertainty in realizing
    tax benefits, potentially exacerbated by compliance-driven cost pressures.
  synthesis_input:
    original_query: What was the change in AMD's deferred tax liability related to acquired intangibles from 2022 to 2023,
      and how might the company's increasing compliance costs associated with SEC regulations influence this financial metric?
    accepted_chunks:
    - chunk_id: AMD_10k_2023.pdf::page_36::chunk_1
      text: '## Table of Contents Environmental laws are complex, change frequently and tend to become more stringent over
        time. For example, the European Union (EU) and China are among a growing number of jurisdictions that have enacted
        restrictions on the use of lead and other materials in electronic products. These regulations affect semiconductor
        devices and packaging. As regulations restricting materials in electronic products continue to increase around the
        world, there is a risk that the cost, quality and manufacturing yields of products that are subject to these restrictions
        may be less favorable compared to products that are not subject to such restrictions, or that the transition to compliant
        products may not meet customer roadmaps, or produce sudden changes in demand, which may result in excess inventory.
        Jurisdictions including the EU, Australia, California and China are developing or have finalized market entry or public
        procurement regulations for computers and servers based on ENERGY STAR specifications, and the like, as well as additional
        energy consumption limits. Certain of our products may be excluded from some of these markets which could materially
        adversely affect us. We incur costs associated with complying with conflict minerals reporting requirements to our
        customers and the SEC. In addition to the SEC regulation, the EU, China and other jurisdictions are developing new
        policies focused on conflict minerals that may impact and increase the cost of our compliance program. Customers are
        increasingly seeking information about the source of minerals used in our supply chain beyond those addressed in laws
        and regulations. Given the complexity of mineral supply chains, we may be unable to sufficiently verify the origins
        of the subject minerals and thus our reputation may be harmed. Moreover, we are likely to encounter challenges to
        satisfy customers who require that all of the components of our products be certified as ''conflict free.'' If we
        cannot satisfy these customers, they may choose a competitor''s products. In addition, new or increased regulations
        limiting the use of such components, or regulation regarding greenhouse gas emissions and climate change-related risks,
        could increase our energy costs, for example as a result of carbon pricing impacts on electrical utilities and/or
        necessitating that we purchase more renewable energy than otherwise planned. Our supply chain manufacturing suppliers
        may be exposed to increased cost of doing business should they be affected by new climate-related regulations, for
        example, affecting abatement equipment, renewable energy, and/or alter production processes and materials selections.
        In addition to our Company, customers, governments and authorities continue to focus on eliminating risks of forced
        labor in supply chains which may increase the cost of our compliance program. Several customers have also issued expectations
        to eliminate these occurrences, if any, that may impact us. While we have a Human Rights Policy and management systems
        to identify and avoid these practices in our supply chain, we cannot guarantee that our suppliers will always be in
        conformance with laws and expectations. Our failure to satisfy customer expectations on forced and trafficked labor
        policies may result in these customers choosing a competitor''s product or enforcement liability and reputational
        challenges. In addition, many governments have enacted laws around PII, such as the GDPR and the CCPA, and the failure
        to comply could result in sanctions or other actions by the governments. The GDPR imposes significant requirements
        on how we collect, process and transfer personal data, as well as significant fines for non-compliance. New emerging
        technology trends, such as AI, require us to keep pace with evolving regulations and industry standards. Given the
        complexity and rapid development of AI, there are various current and proposed regulatory frameworks relating to the
        use of AI in products and services in the U.S. and foreign jurisdictions such as the EU. For example, in the EU, an
        AI act is being considered. Such laws and regulations may impede our ability to offer certain products and services
        in certain jurisdictions if we are unable to comply with them. We expect that the legal and regulatory environment
        relating to emerging technologies such as AI will continue to develop and could increase the cost of doing business,
        and create compliance risks and potential liability, all which may have a material adverse effect on our financial
        condition and results of operations. Governments are also considering the new issues in intellectual property law
        that AI creates, which could result in different intellectual property rights in technology we create with AI and
        development processes and procedures and could have a material adverse effect on our business.'
      ticker: AMD
      fiscal_year: 2023
      section: page_36
      source_file: AMD_10k_2023.pdf
      page_id: page_36
