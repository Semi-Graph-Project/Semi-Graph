  query: What was the dollar increase in Intel's consolidated share of Mobileye's operating income between 2022 and 2023,
    and how did this compare to the overall decline in Intel's total operating income during the same period?
  gold_chunks:
  - INTC_10k_2023.pdf::page_89::chunk_2
  - INTC_10k_2023.pdf::page_88::chunk_2
