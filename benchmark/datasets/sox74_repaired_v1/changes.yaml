  original_query: How does AMD disclose its executive compensation agreements, such as the sign-on bonus agreement with Jean
    Hu, to regulatory bodies and the public?
  repaired_query: How was AMD’s Jean Hu Sign-On Bonus Agreement filed with the SEC, and how does AMD say the public can access
    its filings?
  original_answer:
  - AMD discloses executive compensation agreements through its Investor Relations website (Chunk 1), where it posts SEC filings
    and corporate governance documents 'as soon as reasonably practical' after submission. This includes agreements like the
    Sign-On Bonus Agreement with Jean Hu (Chunk 2), which was filed as Exhibit 10.2 to AMD's Current Report on Form 8-K dated
    January 8, 2023. The SEC requires such disclosures to ensure transparency, and AMD complies by making these documents
    freely accessible on its website, demonstrating the regulatory-to-public disclosure chain mandated by SEC regulations.
  repaired_answer_points:
  - The agreement dated January 8, 2023 was filed as Exhibit 10.2 to the Form 8-K dated January 8, 2023 and later incorporated
    by reference as Exhibit 10.58.
  - AMD posts SEC-filing links on its Investor Relations website as soon as reasonably practical after filing or furnishing;
    SEC.gov also provides access, and AMD offers free copies by mail or email.
