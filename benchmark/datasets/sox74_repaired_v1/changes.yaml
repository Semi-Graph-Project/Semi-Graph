- id: FRKG010
  audit_disposition: repair_evidence
  original_query: What was the total operating profit contribution from the Embedded Processing and Other segments in 2022
    compared to 2023, considering that the Other segment includes restructuring charges and gains/losses from other activities
    as disclosed in the prior year's filing?
  repaired_query: Using TI’s 2022 and 2023 segment tables, compare the combined operating profit of Embedded Processing and
    Other, calculate its dollar and percentage decrease, and state the Restructuring charges/other amount in each year.
  original_answer:
  - In 2022, the Embedded Processing segment contributed $1,253M and the Other segment contributed $528M (including $257M
    in restructuring charges) for a combined total of $1,781M (Chunk 1). In 2023, Embedded Processing contributed $1,008M
    and Other contributed $502M (no restructuring charges) for a combined total of $1,510M (Chunk 2). The $271M decrease (-15.2%)
    occurred despite removing restructuring charges from Other's 2023 results, highlighting how both segments' performance
    and corporate-level adjustments (Chunk 3) directly impacted profitability. The Other segment's inclusion of restructuring
    charges and gains/losses from activities (Chunk 3) explains why its 2022 operating profit was artificially reduced by
    257M before comparing year-over-year changes.
  repaired_answer_points:
  - Combined 2022 operating profit was $1,781 million ($1,253 million + $528 million).
  - Combined 2023 operating profit was $1,510 million ($1,008 million + $502 million).
  - Combined profit decreased by $271 million, or 15.2162%.
  - Restructuring charges/other was $257 million in 2022; the 2023 table reports a dash, meaning no amount on that line.
