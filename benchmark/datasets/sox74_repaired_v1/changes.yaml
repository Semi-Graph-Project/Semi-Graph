- id: FRKG009
  audit_disposition: usable_as_is
  original_query: What percentage of Texas Instruments' 2022 total revenue was represented by restructuring charges disclosed
    in the Other segment, and how does the company's segment reporting structure explain the separation of these charges from
    operating segments like Embedded Processing?
  repaired_query: What percentage of Texas Instruments’ 2022 total revenue did the reported Restructuring charges/other amount
    represent, and why is that item reported in Other rather than an operating segment such as Embedded Processing?
  original_answer:
  - In 2022, restructuring charges in the Other segment amounted to $257 million (Chunk 1), representing 1.28% of total revenue
    ($257M / $20,028M). Texas Instruments' segment reporting structure (Chunk 2) explains that restructuring charges are classified
    as corporate-level items in the Other segment, which are not allocated to operating segments like Embedded Processing.
    This separation reflects how management evaluates segment performance by excluding non-operational corporate expenses
    (Chunk 3 confirms Embedded Processing is a distinct operating segment with 16% revenue contribution in 2024, emphasizing
    its structural independence from corporate charges).
  repaired_answer_points:
  - 'The percentage was 1.2832%: $257 million / $20,028 million × 100.'
  - Other includes restructuring and certain corporate-level items that are not used to evaluate operating-segment results
    or allocate resources to those segments.
