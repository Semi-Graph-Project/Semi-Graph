- id: FRKG011
  audit_disposition: rewrite_or_exclude
  original_query: What was the change in AMD's deferred tax liability related to acquired intangibles from 2022 to 2023, and
    how might the company's increasing compliance costs associated with SEC regulations influence this financial metric?
  repaired_query: How did the magnitude of AMD’s acquired-intangibles deferred tax liability and its valuation allowance change
    from 2022 to 2023? Does the supplied compliance-cost paragraph quantify a contribution to either change?
  original_answer:
  - AMD's deferred tax liability for acquired intangibles decreased by $326 million from 2022 ($3,430M) to 2023 ($3,104M).
    This decrease could be partially attributed to higher compliance costs linked to SEC regulations (e.g., conflict minerals
    reporting), which increase operating expenses and reduce taxable income. Lower taxable income reduces deferred tax liabilities
    over time, as these liabilities reflect future tax obligations tied to temporary differences in asset/liability valuations.
    The $46M increase in valuation allowances (from $2,078M to $2,124M) further suggests heightened uncertainty in realizing
    tax benefits, potentially exacerbated by compliance-driven cost pressures.
  repaired_answer_points:
  - The acquired-intangibles deferred tax liability decreased in magnitude by $326 million, from $3,430 million to $3,104
    million.
  - The valuation allowance increased by $46 million, from $2,078 million to $2,124 million.
  - The compliance paragraph describes costs and possible increases but does not quantify a contribution to either tax-balance
    change.
