  - INTC_10k_2023.pdf::page_88::chunk_2
  repaired_gold_chunks:
  - INTC_10k_2023.pdf::page_88::chunk_2
  - INTC_10k_2022.pdf::page_30::chunk_1
  added_gold_chunks: []
  removed_gold_chunks: []
  reason: คำนวณ 50% ได้ และมี initiatives จริง แต่ข้อมูล initiatives เป็นภาพปี 2021/แผนใน filing ปี 2022 ไม่ได้แจกแจงว่าเป็นสาเหตุของรายได้ปี
    2023 ที่เพิ่มขึ้นเท่าใด
