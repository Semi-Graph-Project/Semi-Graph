- id: FRKG082
  audit_disposition: repair_evidence
  original_query: What was the impact of the All Other segment's operating loss in 2023 on Intel's total operating income,
    and how does the segment's composition of non-reportable businesses and intersegment allocations contribute to this financial
    outcome?
  repaired_query: On Intel’s 2023 reporting basis, what was All other’s operating loss, what consolidated operating income
    remained, and which categories does that filing include in All other?
  original_answer:
  - The All Other segment reported an operating loss of $5,597 million in 2023 (Chunk 2), which significantly reduced Intel's
    total operating income to just $93 million. This segment's composition—including non-reportable businesses like Altera
    and Mobileye, startup initiatives, and intersegment revenue/expenses (Chunk 1)—means its financial performance reflects
    both unprofitable strategic ventures and allocated costs from corporate functions. The intersegment allocations (e.g.,
    sales/marketing expenses to Intel Products segments and unallocated corporate costs) amplify its negative contribution,
    demonstrating how Intel's internal cost distribution and underperforming subsidiaries directly erode consolidated profitability.
  repaired_answer_points:
  - All other had a $5,597 million operating loss in 2023; consolidated operating income was $93 million.
  - All other includes non-reportable operations not otherwise presented and start-ups, divested-business historical results,
    restructuring and other charges, unallocated employee/compensation/impairment expenses, and acquisition-related costs.
