- id: FRKG093
  audit_disposition: repair_reference
  original_query: What was the percentage change in the value per percentage point of Mobileye's non-controlling interest
    from 2022 to 2023, and how does this reflect Intel's stake valuation in the segment?
  repaired_query: Using Mobileye’s non-controlling-interest amount and ownership percentage, calculate the carrying amount
    per one ownership percentage point in 2022 and 2023, its percentage change, and Intel’s residual ownership percentages.
  original_answer:
  - In 2022, Mobileye's non-controlling interest was $989 million at 6% ownership, equating to $164.83 million per percentage
    point (Chunk 2). In 2023, this increased to $1,838 million at 12% ownership, equating to $153.17 million per percentage
    point. The percentage change in value per point was ($153.17 - $164.83)/$164.83 = -7.07%. This decline suggests that while
    Intel increased its ownership stake (from 6% to 12%) in Mobileye (Chunk 1), the valuation per percentage point decreased,
    potentially indicating equity dilution or lower asset valuations in Mobileye relative to Intel's consolidated financial
    position.
  repaired_answer_points:
  - The amounts per percentage point were $164.8333 million in 2022 and $153.1667 million in 2023.
  - The amount per percentage point decreased by 7.0779%.
  - Non-controlling ownership increased from 6% to 12%; Intel’s residual percentages were therefore 94% and 88%, assuming
    the remaining ownership was Intel’s.
  original_gold_chunks:
