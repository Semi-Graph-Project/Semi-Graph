- id: FRKG100
  audit_disposition: rewrite_or_exclude
  original_query: What was the operating profit contribution from the Embedded Processing segment in 2022, and how does this
    directly affect Texas Instruments' deferred tax liabilities under their asset and liability accounting approach for income
    taxes?
  repaired_query: What operating profit did TI Embedded Processing report in 2022, and which current-year and future-tax balances
    does TI’s stated asset-and-liability income-tax policy recognize?
  original_answer:
  - The Embedded Processing segment generated an operating profit of $1,253 million in 2022 (Chunk 1). Under Texas Instruments'
    income tax accounting policy, which uses an asset and liability approach to record deferred tax assets and liabilities
    for future tax consequences of events recognized in financial statements (Chunk 2), this profit increases taxable income.
    Higher taxable income directly leads to higher deferred tax liabilities if temporary differences exist between book and
    tax accounting, as the company must recognize future tax obligations tied to current profitability.
  repaired_answer_points:
  - Embedded Processing reported $1,253 million of operating profit in 2022.
  - TI records taxes payable or refundable for the current year.
  - TI records deferred tax assets and liabilities for future tax consequences of events recognized in financial statements
    or tax returns.
