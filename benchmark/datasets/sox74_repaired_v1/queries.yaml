    point_3: &id004
    - INTC_10k_2024.pdf::page_71::chunk_1
    - NVDA_10k_2024.pdf::page_78::chunk_1
  answer_points:
  - Intel does not allocate corporate share-based compensation or specified acquisition-related adjustments to its operating
    segments.
  - NVIDIA explicitly includes stock-based compensation and acquisition-related and other costs in All Other, outside its
    two operating segments.
  - Both excerpts exclude these corporate costs from operating-segment measures; the excerpts do not establish that Intel
    and NVIDIA use an identically scoped All Other category.
  reference_answer: Intel does not allocate corporate share-based compensation or specified acquisition-related adjustments
    to its operating segments. NVIDIA explicitly includes stock-based compensation and acquisition-related and other costs
    in All Other, outside its two operating segments. Both excerpts exclude these corporate costs from operating-segment measures;
    the excerpts do not establish that Intel and NVIDIA use an identically scoped All Other category.
