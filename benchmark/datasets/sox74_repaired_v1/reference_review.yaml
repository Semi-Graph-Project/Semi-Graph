- id: FRKG523
  query: Which inputs does AMD use for expected stock-option volatility, the risk-free rate, expected dividend yield and the
    expected term of employee stock options?
  answer_points:
  - 'POINT 1: Expected volatility combines historical volatility of AMD common stock and implied volatility of publicly traded
    options on that stock.'
  - 'POINT 2: The risk-free rate uses a US Treasury zero-coupon yield curve with a term approximating the option’s expected
    life at the date closest to the grant date.'
  - 'POINT 3: Expected dividend yield is zero because AMD does not expect to pay dividends in the near future.'
  - 'POINT 4: Expected term is the weighted-average period the employee options are expected to remain outstanding.'
