  scope: A repaired derivative of the 74 SOX evaluation cases. IDs preserve lineage; question meaning, reference claims and
    Gold selections may differ from the original.
  not_an_unchanged_reproduction_of_finreflectkg: true
  review_status: assistant_curated_source_and_numeric_checks_passed
  independent_human_review_completed: false
  answer_point_policy:
  - Each point corresponds to a requested part; no generic causal, governance or performance conclusions are added.
  - Grade the requested fact or calculation, not incidental clarification wording. Explanatory qualifications not requested
    by the question add no separate coverage requirement; contradictions remain incorrect.
  - Equivalent wording and mathematically equivalent rounding are acceptable. Preserve signs, units, periods and metric identities.
  - A requested single example accepts any documented valid alternative; see accepted_answer_alternatives.
  - Scope-check questions are answered about the supplied excerpts, not about all possible evidence outside them.
  evidence_policy:
  - Every supplied text is verbatim from data/finreflectkg_sox.parquet.
  - Unit/date/metric context is supplied as additional real chunks, never as fabricated explanatory text.
  - Content chunk count describes this evidence package, not a proven minimum reasoning-hop count across the entire corpus.
  - No original graph-path hop label is asserted for the repaired questions.
  requires_corpus_verification_before_retrieval_comparison: true
  retrieval_database_updated: false
  score_comparability: Rerun every architecture on this revision and the same updated corpus; do not compare these scores
    directly with old question/reference scores.
