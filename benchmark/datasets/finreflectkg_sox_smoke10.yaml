- id: FRKG082
  query: What was the impact of the All Other segment's operating loss in 2023 on Intel's total operating income, and how
    does the segment's composition of non-reportable businesses and intersegment allocations contribute to this financial
    outcome?
  type: 2hop_inter_document_same_company
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - intc
  - all other
  - total operating income
  gold_chunks:
  - INTC_10k_2024.pdf::page_71::chunk_1
  - INTC_10k_2023.pdf::page_88::chunk_2
  gold_evidence_groups:
    hop_1:
    - INTC_10k_2024.pdf::page_71::chunk_1
    hop_2:
    - INTC_10k_2023.pdf::page_88::chunk_2
  answer_points:
  - "The All Other segment reported an operating loss of $5,597 million in 2023 (Chunk 2), which significantly reduced Intel's\
    \ total operating income to just $93 million. This segment's composition\u2014including non-reportable businesses like\
    \ Altera and Mobileye, startup initiatives, and intersegment revenue/expenses (Chunk 1)\u2014means its financial performance\
    \ reflects both unprofitable strategic ventures and allocated costs from corporate functions. The intersegment allocations\
    \ (e.g., sales/marketing expenses to Intel Products segments and unallocated corporate costs) amplify its negative contribution,\
    \ demonstrating how Intel's internal cost distribution and underperforming subsidiaries directly erode consolidated profitability."
  benchmark_metadata:
    question_id: 82
    hop_count: 2
    document_relationship: inter_document_same_company
    pattern: ORG -> Has_Stake_In -> SEGMENT -> Discloses -> FIN_METRIC
- id: FRKG084
  query: By how many percentage points did the operating income growth rate for AVGO's Infrastructure Software segment exceed
    its revenue growth rate in fiscal year 2022, and what does this indicate about the segment's operational efficiency?
  type: 2hop_intra_document
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - avgo
  - infrastructure software
  - operating income
  gold_chunks:
  - AVGO_10k_2022.pdf::page_70::chunk_2
  - AVGO_10k_2022.pdf::page_71::chunk_4
  gold_evidence_groups:
    hop_1:
    - AVGO_10k_2022.pdf::page_70::chunk_2
    hop_2:
    - AVGO_10k_2022.pdf::page_71::chunk_4
  answer_points:
  - The Infrastructure Software segment's revenue grew by 4% (from $7,067M in 2021 to $7,385M in 2022) while its operating
    income grew by 6% (from $4,936M in 2021 to $5,219M in 2022). This 2 percentage point difference indicates improved operational
    efficiency, as the segment generated higher profit growth relative to its revenue growth. The increased operating margin
    (from 69.8% in 2021 to 70.7% in 2022) demonstrates better cost management and profitability enhancement.
  benchmark_metadata:
    question_id: 84
    hop_count: 2
    document_relationship: intra_document
    pattern: ORG -> Has_Stake_In -> SEGMENT -> Discloses -> FIN_METRIC
- id: FRKG093
  query: What was the percentage change in the value per percentage point of Mobileye's non-controlling interest from 2022
    to 2023, and how does this reflect Intel's stake valuation in the segment?
  type: 2hop_inter_document_same_company
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - intc
  - mobileye
  - $ 989
  gold_chunks:
  - INTC_10k_2024.pdf::page_70::chunk_1
  - INTC_10k_2023.pdf::page_89::chunk_2
  gold_evidence_groups:
    hop_1:
    - INTC_10k_2024.pdf::page_70::chunk_1
    hop_2:
    - INTC_10k_2023.pdf::page_89::chunk_2
  answer_points:
  - In 2022, Mobileye's non-controlling interest was $989 million at 6% ownership, equating to $164.83 million per percentage
    point (Chunk 2). In 2023, this increased to $1,838 million at 12% ownership, equating to $153.17 million per percentage
    point. The percentage change in value per point was ($153.17 - $164.83)/$164.83 = -7.07%. This decline suggests that while
    Intel increased its ownership stake (from 6% to 12%) in Mobileye (Chunk 1), the valuation per percentage point decreased,
    potentially indicating equity dilution or lower asset valuations in Mobileye relative to Intel's consolidated financial
    position.
  benchmark_metadata:
    question_id: 93
    hop_count: 2
    document_relationship: inter_document_same_company
    pattern: ORG -> Has_Stake_In -> SEGMENT -> Discloses -> FIN_METRIC
