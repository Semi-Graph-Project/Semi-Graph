queries:
- id: FRKG003
  query: Based on the segment disclosures and term definitions in their 2024 10-K filings, how do Intel and NVIDIA differ
    in the treatment of stock-based compensation expenses within their 'All Other' categories, and what does this reveal about
    their corporate expense allocation practices?
  type: 3hop_inter_document_cross_company
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - cdp
  - intc
  - all other
  - stock-based compensation expense
  gold_chunks:
  - INTC_10k_2024.pdf::page_102::chunk_2
  - INTC_10k_2024.pdf::page_71::chunk_1
  - NVDA_10k_2024.pdf::page_78::chunk_1
  gold_evidence_groups:
    hop_1:
    - INTC_10k_2024.pdf::page_102::chunk_2
    hop_2:
    - INTC_10k_2024.pdf::page_71::chunk_1
    hop_3:
    - NVDA_10k_2024.pdf::page_78::chunk_1
  answer_points:
  - Intel's 'All Other' category, as defined in its glossary (Chunk 1), includes non-reportable segments and startup businesses.
    According to Chunk 2, Intel does not allocate stock-based compensation expenses to its operating segments, as these are
    considered corporate-level expenses. In contrast, NVIDIA's 'All Other' category, as detailed in Chunk 3, explicitly includes
    stock-based compensation expense as part of its enterprise-level costs. This reveals that Intel maintains stock-based
    compensation as a centralized corporate expense, while NVIDIA incorporates it directly into its 'All Other' segment's
    financial reporting, highlighting different approaches to expense allocation between the two companies.
  benchmark_metadata:
    question_id: 3
    hop_count: 3
    document_relationship: inter_document_cross_company
    pattern: ORG_REG -> Regulates -> ORG -> Has_Stake_In -> SEGMENT -> Discloses -> FIN_METRIC
- id: FRKG009
  query: What percentage of Texas Instruments' 2022 total revenue was represented by restructuring charges disclosed in the
    Other segment, and how does the company's segment reporting structure explain the separation of these charges from operating
    segments like Embedded Processing?
  type: 3hop_intra_document
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - embedded processing
  - txn
  - other segment
  - restructuring charges
  gold_chunks:
  - TXN_10k_2024.pdf::page_31::chunk_3
  - TXN_10k_2023.pdf::page_30::chunk_1
  - TXN_10k_2024.pdf::page_4::chunk_1
  gold_evidence_groups:
    hop_1:
    - TXN_10k_2024.pdf::page_31::chunk_3
    hop_2:
    - TXN_10k_2023.pdf::page_30::chunk_1
    hop_3:
    - TXN_10k_2024.pdf::page_4::chunk_1
  answer_points:
  - In 2022, restructuring charges in the Other segment amounted to $257 million (Chunk 1), representing 1.28% of total revenue
    ($257M / $20,028M). Texas Instruments' segment reporting structure (Chunk 2) explains that restructuring charges are classified
    as corporate-level items in the Other segment, which are not allocated to operating segments like Embedded Processing.
    This separation reflects how management evaluates segment performance by excluding non-operational corporate expenses
    (Chunk 3 confirms Embedded Processing is a distinct operating segment with 16% revenue contribution in 2024, emphasizing
    its structural independence from corporate charges).
  benchmark_metadata:
    question_id: 9
    hop_count: 3
    document_relationship: intra_document
    pattern: SEGMENT -> Has_Stake_In -> ORG -> Has_Stake_In -> SEGMENT -> Discloses -> FIN_METRIC
- id: FRKG010
  query: What was the total operating profit contribution from the Embedded Processing and Other segments in 2022 compared
    to 2023, considering that the Other segment includes restructuring charges and gains/losses from other activities as disclosed
    in the prior year's filing?
  type: 3hop_inter_document_same_company
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - embedded processing
  - txn
  - other
  - gains and losses from other activities
  gold_chunks:
  - TXN_10k_2024.pdf::page_31::chunk_3
  - TXN_10k_2024.pdf::page_31::chunk_1
  - TXN_10k_2022.pdf::page_6::chunk_1
  gold_evidence_groups:
    hop_1:
    - TXN_10k_2024.pdf::page_31::chunk_3
    hop_2:
    - TXN_10k_2024.pdf::page_31::chunk_1
    hop_3:
    - TXN_10k_2022.pdf::page_6::chunk_1
  answer_points:
  - In 2022, the Embedded Processing segment contributed $1,253M and the Other segment contributed $528M (including $257M
    in restructuring charges) for a combined total of $1,781M (Chunk 1). In 2023, Embedded Processing contributed $1,008M
    and Other contributed $502M (no restructuring charges) for a combined total of $1,510M (Chunk 2). The $271M decrease (-15.2%)
    occurred despite removing restructuring charges from Other's 2023 results, highlighting how both segments' performance
    and corporate-level adjustments (Chunk 3) directly impacted profitability. The Other segment's inclusion of restructuring
    charges and gains/losses from activities (Chunk 3) explains why its 2022 operating profit was artificially reduced by
    257M before comparing year-over-year changes.
  benchmark_metadata:
    question_id: 10
    hop_count: 3
    document_relationship: inter_document_same_company
    pattern: SEGMENT -> Has_Stake_In -> ORG -> Has_Stake_In -> SEGMENT -> Discloses -> FIN_METRIC
- id: FRKG011
  query: What was the change in AMD's deferred tax liability related to acquired intangibles from 2022 to 2023, and how might
    the company's increasing compliance costs associated with SEC regulations influence this financial metric?
  type: 2hop_intra_document
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - sec
  - amd
  - acquired intangibles
  gold_chunks:
  - AMD_10k_2023.pdf::page_36::chunk_1
  - AMD_10k_2023.pdf::page_88::chunk_2
  gold_evidence_groups:
    hop_1:
    - AMD_10k_2023.pdf::page_36::chunk_1
    hop_2:
    - AMD_10k_2023.pdf::page_88::chunk_2
  answer_points:
  - AMD's deferred tax liability for acquired intangibles decreased by $326 million from 2022 ($3,430M) to 2023 ($3,104M).
    This decrease could be partially attributed to higher compliance costs linked to SEC regulations (e.g., conflict minerals
    reporting), which increase operating expenses and reduce taxable income. Lower taxable income reduces deferred tax liabilities
    over time, as these liabilities reflect future tax obligations tied to temporary differences in asset/liability valuations.
    The $46M increase in valuation allowances (from $2,078M to $2,124M) further suggests heightened uncertainty in realizing
    tax benefits, potentially exacerbated by compliance-driven cost pressures.
  benchmark_metadata:
    question_id: 11
    hop_count: 2
    document_relationship: intra_document
    pattern: ORG_REG -> Regulates -> ORG -> Discloses -> FIN_METRIC
- id: FRKG070
  query: Calculate the total percentage growth in Mobileye's revenue from 2021 to 2023 and explain how the strategic initiatives
    outlined in the 2022 filing contributed to this increase.
  type: 2hop_inter_document_same_company
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - intc
  - mobileye
  - revenue
  gold_chunks:
  - INTC_10k_2022.pdf::page_30::chunk_1
  - INTC_10k_2023.pdf::page_88::chunk_2
  gold_evidence_groups:
    hop_1:
    - INTC_10k_2022.pdf::page_30::chunk_1
    hop_2:
    - INTC_10k_2023.pdf::page_88::chunk_2
  answer_points:
  - "Mobileye's revenue grew from $1,386 million in 2021 to $2,079 million in 2023, representing a 50% increase ($2,079M -\
    \ $1,386M = $693M; $693M \xF7 $1,386M = 0.50). This growth was driven by strategic initiatives mentioned in the 2022 filing,\
    \ including securing 41 new ADAS design wins with major OEMs like Toyota and VW, expanding REM high-definition mapping\
    \ partnerships, and launching scalable autonomous driving solutions (Mobileye Drive\u2122 and Robotaxi services). These\
    \ initiatives directly supported increased adoption of ADAS technologies and positioned Mobileye for growth in both commercial\
    \ and consumer autonomous vehicle markets."
  benchmark_metadata:
    question_id: 70
    hop_count: 2
    document_relationship: inter_document_same_company
    pattern: ORG -> Has_Stake_In -> SEGMENT -> Discloses -> FIN_METRIC
