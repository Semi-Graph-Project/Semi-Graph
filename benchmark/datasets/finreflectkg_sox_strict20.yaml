- id: FRKG093
  query: What was the percentage change in the value per percentage point of Mobileye's non-controlling interest from 2022
    to 2023, and how does this reflect Intel's stake valuation in the segment?
  type: 2hop_inter_document_same_company
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - intc
  - mobileye
  - $ 989
  gold_chunks:
  - INTC_10k_2024.pdf::page_70::chunk_1
  - INTC_10k_2023.pdf::page_89::chunk_2
  gold_evidence_groups:
    hop_1:
    - INTC_10k_2024.pdf::page_70::chunk_1
    hop_2:
    - INTC_10k_2023.pdf::page_89::chunk_2
  answer_points:
  - In 2022, Mobileye's non-controlling interest was $989 million at 6% ownership, equating to $164.83 million per percentage
    point (Chunk 2). In 2023, this increased to $1,838 million at 12% ownership, equating to $153.17 million per percentage
    point. The percentage change in value per point was ($153.17 - $164.83)/$164.83 = -7.07%. This decline suggests that while
    Intel increased its ownership stake (from 6% to 12%) in Mobileye (Chunk 1), the valuation per percentage point decreased,
    potentially indicating equity dilution or lower asset valuations in Mobileye relative to Intel's consolidated financial
    position.
  benchmark_metadata:
