- id: FRKG011
  query: What was the change in AMD's deferred tax liability related to acquired intangibles from 2022 to 2023, and how might
    the company's increasing compliance costs associated with SEC regulations influence this financial metric?
  type: 2hop_intra_document
  gold_tools:
  - vector
  - graph
  - hybrid
  gold_entities:
  - sec
  - amd
  - acquired intangibles
  gold_chunks:
  - AMD_10k_2023.pdf::page_36::chunk_1
  - AMD_10k_2023.pdf::page_88::chunk_2
  gold_evidence_groups:
    hop_1:
    - AMD_10k_2023.pdf::page_36::chunk_1
    hop_2:
    - AMD_10k_2023.pdf::page_88::chunk_2
  answer_points:
  - AMD's deferred tax liability for acquired intangibles decreased by $326 million from 2022 ($3,430M) to 2023 ($3,104M).
    This decrease could be partially attributed to higher compliance costs linked to SEC regulations (e.g., conflict minerals
    reporting), which increase operating expenses and reduce taxable income. Lower taxable income reduces deferred tax liabilities
    over time, as these liabilities reflect future tax obligations tied to temporary differences in asset/liability valuations.
    The $46M increase in valuation allowances (from $2,078M to $2,124M) further suggests heightened uncertainty in realizing
    tax benefits, potentially exacerbated by compliance-driven cost pressures.
  benchmark_metadata:
    question_id: 11
    hop_count: 2
    document_relationship: intra_document
