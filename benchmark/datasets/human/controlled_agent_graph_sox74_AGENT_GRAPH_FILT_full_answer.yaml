    (Chunk 3 confirms Embedded Processing is a distinct operating segment with 16% revenue contribution in 2024, emphasizing
    its structural independence from corporate charges).
  final_answer: 'POINT 1 [COMPLETE]: Restructuring charges represented \(257 / 20{,}028 \times 100 = 1.2832\%\) of Texas Instruments’
    2022 total revenue, using $257 million of restructuring charges/other and $20,028 million of total revenue. [TXN_10k_2024.pdf::page_31::chunk_3]

    POINT 2 [COMPLETE]: Texas Instruments has two reportable segments, Analog and Embedded Processing. Other contains remaining
    activities plus items not used to evaluate segment results or allocate resources; restructuring charges are specifically
    included in Other for segment reporting, separating them from Embedded Processing. [TXN_10k_2024.pdf::page_30::chunk_1]
