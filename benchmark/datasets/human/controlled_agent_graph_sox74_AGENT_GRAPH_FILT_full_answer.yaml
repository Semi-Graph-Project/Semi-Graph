    does the segment's composition of non-reportable businesses and intersegment allocations contribute to this financial
    outcome?
  gold_chunks:
  - INTC_10k_2024.pdf::page_71::chunk_1
  - INTC_10k_2023.pdf::page_88::chunk_2
  top_chunk_ids:
