  - AMD_10k_2024.pdf::page_69::chunk_1
  - NVDA_10k_2023.pdf::page_58::chunk_1
  - NVDA_10k_2024.pdf::page_60::chunk_1
  answer_points:
  - Intel's 'All Other' category, as defined in its glossary (Chunk 1), includes non-reportable segments and startup businesses.
    According to Chunk 2, Intel does not allocate stock-based compensation expenses to its operating segments, as these are
    considered corporate-level expenses. In contrast, NVIDIA's 'All Other' category, as detailed in Chunk 3, explicitly includes
    stock-based compensation expense as part of its enterprise-level costs. This reveals that Intel maintains stock-based
    compensation as a centralized corporate expense, while NVIDIA incorporates it directly into its 'All Other' segment's
    financial reporting, highlighting different approaches to expense allocation between the two companies.
  final_answer: NVIDIA places stock-based compensation expense directly in its 'All Other' category, which is a catch‑all
    for enterprise‑level costs not assigned to the Compute & Networking or Graphics segments. Intel, by contrast, excludes
    share‑based compensation from its 'All Other' category; Intel's 'All Other' category holds the financial results of other
    non‑reportable businesses (e.g., Altera, Mobileye), while share‑based compensation is listed among corporate operating
    expenses that are deliberately not allocated to any operating segment. [NVDA_10k_2024.pdf::page_78::chunk_1] [INTC_10k_2024.pdf::page_71::chunk_1]
    Both companies treat stock‑based compensation as a corporate‑level expense that is not attributed to segment operating
    performance. However, NVIDIA consolidates it within a single 'All Other' category alongside other enterprise costs, suggesting
    a broader aggregation of unallocated items. Intel separates share‑based compensation from its 'All Other' category, placing
    it in a distinct list of corporate operating expenses not allocated to segments, which indicates a more detailed categorization
    of unallocated costs. [NVDA_10k_2024.pdf::page_78::chunk_1] [INTC_10k_2024.pdf::page_71::chunk_1]
