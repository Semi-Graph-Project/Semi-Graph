        - NVDA_10k_2024.pdf::page_78::chunk_1
      - claim: NVIDIA makes the corporate treatment explicit by placing the expense in All Other, whereas Intel describes
          it as an unallocated corporate operating expense and separately defines All Other around non-reportable businesses.
        evidence_ids:
        - INTC_10k_2024.pdf::page_71::chunk_1
        - NVDA_10k_2024.pdf::page_78::chunk_1
      missing_information: The excerpts do not establish the exact financial-statement line or category in which Intel records
        its unallocated share-based compensation.
      answer: The disclosures indicate a common practice of keeping corporate share-based compensation outside segment results,
        so segment profitability reflects expenses viewed as attributable to the businesses. NVIDIA uses All Other as an explicit
        enterprise-cost bucket; Intel's presentation distinguishes unallocated corporate costs from its primarily business-oriented
        All Other category. [INTC_10k_2024.pdf::page_71::chunk_1] [NVDA_10k_2024.pdf::page_78::chunk_1]
