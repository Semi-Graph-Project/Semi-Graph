    link them to CDP environmental disclosure requirements. The model took effect in Q1 2024 to create the Intel Products–Intel
    Foundry relationship and improve transparency, accountability, cost focus, and efficiency. [INTC_10k_2024.pdf::page_70::chunk_1]
