    point in 2022 to $153.166666... million in 2023, calculated as [($1,838/12 - $989/6) / ($989/6)] × 100. [INTC_10k_2023.pdf::page_89::chunk_2]
    The 7.08% decline indicates that Mobileye's implied value per ownership point was lower in 2023, providing a lower proportional
    valuation basis for Intel's interest. Intel also monetized 5% of Mobileye at $42 per share in 2023 while continuing to
