        is principally a residual business-category definition rather than an explicit stock-compensation bucket. [INTC_10k_2024.pdf::page_71::chunk_1]
    - requested_part: NVIDIA’s treatment of stock-based compensation within its “All Other” category
      supported_facts:
      - claim: NVIDIA explicitly includes stock-based compensation expense in “All Other,” along with corporate infrastructure
