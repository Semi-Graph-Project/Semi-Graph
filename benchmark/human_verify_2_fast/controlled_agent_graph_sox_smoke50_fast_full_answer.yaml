    2022 to $153.166667 million in 2023 [INTC_10k_2023.pdf::page_89::chunk_2]. The lower value per percentage point implies
    a lower accounting-implied Mobileye valuation. Combined with Intel's inferred ownership decline from 94% to 88%, Intel's
    implied stake value fell about 13.01% [INTC_10k_2023.pdf::page_89::chunk_2].
