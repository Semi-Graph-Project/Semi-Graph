  query: Calculate the total percentage growth in Mobileye's revenue from 2021 to 2023 and explain how the strategic initiatives
    outlined in the 2022 filing contributed to this increase.
  gold_chunks:
  - INTC_10k_2022.pdf::page_30::chunk_1
