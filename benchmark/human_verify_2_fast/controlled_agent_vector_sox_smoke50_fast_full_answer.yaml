  answer_points:
  - AMD's deferred tax liability for acquired intangibles decreased by $326 million from 2022 ($3,430M) to 2023 ($3,104M).
    This decrease could be partially attributed to higher compliance costs linked to SEC regulations (e.g., conflict minerals
    reporting), which increase operating expenses and reduce taxable income. Lower taxable income reduces deferred tax liabilities
    over time, as these liabilities reflect future tax obligations tied to temporary differences in asset/liability valuations.
    The $46M increase in valuation allowances (from $2,078M to $2,124M) further suggests heightened uncertainty in realizing
    tax benefits, potentially exacerbated by compliance-driven cost pressures.
  final_answer: The change in the specified deferred tax liability cannot be determined from the supplied evidence. The related
    acquisition-intangible amortization did decrease by $737 million, or 21%, from $3.5 billion in 2022 to $2.8 billion in
    2023, but amortization is not the deferred tax liability itself [AMD_10k_2023.pdf::page_53::chunk_1]. [AMD_10k_2023.pdf::page_68::chunk_1]
    No supported conclusion can be made about how increasing SEC-related compliance costs would change this deferred tax liability.
    The evidence supports increased information-security costs and future tax-disclosure requirements, but not a quantified
    or causal impact on the liability [AMD_10k_2023.pdf::page_4::chunk_1] [AMD_10k_2023.pdf::page_68::chunk_1].
