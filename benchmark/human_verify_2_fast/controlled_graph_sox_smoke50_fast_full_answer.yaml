    million) × 100 = 1.2832%. [TXN_10k_2024.pdf::page_31::chunk_3] The charges are separated because Embedded Processing is
    a reportable operating segment whose results are used for performance evaluation and resource allocation, while restructuring
    charges are corporate-level items that Texas Instruments does not use for those purposes and therefore reports in Other.
