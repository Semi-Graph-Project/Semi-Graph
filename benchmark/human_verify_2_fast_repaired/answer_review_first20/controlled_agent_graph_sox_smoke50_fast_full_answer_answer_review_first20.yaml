    describes non-reportable businesses and other operations, but does not expressly place share-based compensation there.
    [INTC_10k_2024.pdf::page_71::chunk_1] NVIDIA explicitly centralizes stock-based compensation in ''All Other'' alongside
    other enterprise expenses rather than allocating it to either reportable segment. [NVDA_10k_2024.pdf::page_78::chunk_1]
    [NVDA_10k_2024.pdf::page_41::chunk_5] The disclosures show different presentation practices: NVIDIA explicitly uses ''All
    Other'' to centralize enterprise-wide expenses such as stock-based compensation, whereas Intel allocates some shared functions
    but keeps share-based compensation and other corporate costs outside operating-segment results. Intel''s exact presentation
    location for that unallocated compensation is not disclosed here. [INTC_10k_2024.pdf::page_71::chunk_1] [NVDA_10k_2024.pdf::page_78::chunk_1]'
