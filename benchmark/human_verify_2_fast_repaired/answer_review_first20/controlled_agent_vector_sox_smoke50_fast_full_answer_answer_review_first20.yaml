    segments.
  - NVIDIA explicitly includes stock-based compensation and acquisition-related and other costs in All Other, outside its
    two operating segments.
  - Both excerpts exclude these corporate costs from operating-segment measures; the excerpts do not establish that Intel
    and NVIDIA use an identically scoped All Other category.
  final_answer: 'Intel excludes share-based compensation from operating-segment allocations and treats it as a corporate expense.
