  retrieval_rerun: false
  scoring_rule: Binary semantic coverage per repaired reference point; no partial credit within a point, no unsure or excluded
    points.
  averaging: 'Primary Answer Recall is micro: total correct points / total reference points, as in the HTML.'
  point_roles: All 51 points in the repaired first-20 reference are MAIN; Main metrics equal Answer metrics.
  policy:
  - Each point corresponds to a requested part; no generic causal, governance or performance conclusions are added.
  - Grade the requested fact or calculation, not incidental clarification wording. Explanatory qualifications not requested
    by the question add no separate coverage requirement; contradictions remain incorrect.
  - Equivalent wording and mathematically equivalent rounding are acceptable. Preserve signs, units, periods and metric identities.
  - A requested single example accepts any documented valid alternative; see accepted_answer_alternatives.
  - Scope-check questions are answered about the supplied excerpts, not about all possible evidence outside them.
  adjudication_notes:
  - Read and adjudicated each of the 100 saved Final Answers against its repaired reference; decisions are authored judgments,
    not keyword-based grading.
  - Preserve signs, units, periods and metric identities. Missing million on a monetary amount fails that amount point; correctly
    computed dimensionless ratios can pass.
  - Accept equivalent wording, documented alternative examples and mathematically equivalent rounding. Do not fill in unstated
    calculations or requested facts from citations.
  - Reference exhibit identifiers are treated as important parts of the filing route. Publication timing and incidental titles
    not separately requested are not additional requirements.
  - Each point containing several requested facts must cover those facts. A statement about DTL alone does not cover the additional
    valuation-allowance balance in the repaired compliance question.
  scope_note: Saved answers were generated for original questions/retrievals; repaired questions and Gold can differ. This
    is a cross-revision reference-coverage review, not a new end-to-end run on Repair.
  incorrect_label_note: Incorrect includes omissions, unit errors, refusals and changed-question mismatches; it does not always
    mean a false factual statement.
  no_faithfulness_claim: These scores measure reference-point coverage, not a separate claim-by-claim faithfulness or hallucination
    audit.
