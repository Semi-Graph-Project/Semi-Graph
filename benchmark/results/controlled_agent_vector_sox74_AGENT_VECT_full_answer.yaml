  - INTC_10k_2023.pdf::page_97::chunk_2
  - QCOM_10k_2022.pdf::page_40::chunk_3
  answer_points:
  - Mobileye's revenue grew from $1,386 million in 2021 to $2,079 million in 2023, representing a 50% increase ($2,079M -
    $1,386M = $693M; $693M ÷ $1,386M = 0.50). This growth was driven by strategic initiatives mentioned in the 2022 filing,
    including securing 41 new ADAS design wins with major OEMs like Toyota and VW, expanding REM high-definition mapping partnerships,
    and launching scalable autonomous driving solutions (Mobileye Drive™ and Robotaxi services). These initiatives directly
    supported increased adoption of ADAS technologies and positioned Mobileye for growth in both commercial and consumer autonomous
    vehicle markets.
  final_answer: 'POINT 1 [COMPLETE]: Mobileye revenue grew from $1,386 million in 2021 to $2,079 million in 2023; growth =
    (($2,079 − $1,386) ÷ $1,386) × 100 = 50% [INTC_10k_2023.pdf::page_88::chunk_2].

    POINT 2 [PARTIAL]: The 2022 filing identified growth initiatives including 42% EyeQ SoC volume growth, 41 new ADAS design
    wins, Mobileye Drive™ collaborations, Robotaxi development, and a strategy using lean compute, REM crowdsourced maps,
    and high-resolution imaging radar to scale ADAS and autonomous-driving products [INTC_10k_2022.pdf::page_30::chunk_1].
    These initiatives expanded product adoption, OEM relationships, and potential commercial applications, but the supplied
    evidence does not directly attribute the 2021–2023 revenue increase to any specific initiative.'
