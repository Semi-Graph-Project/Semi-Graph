  - INTC_10k_2024.pdf::page_28::chunk_3
  answer_points:
  - In 2022, restructuring charges in the Other segment amounted to $257 million (Chunk 1), representing 1.28% of total revenue
    ($257M / $20,028M). Texas Instruments' segment reporting structure (Chunk 2) explains that restructuring charges are classified
    as corporate-level items in the Other segment, which are not allocated to operating segments like Embedded Processing.
    This separation reflects how management evaluates segment performance by excluding non-operational corporate expenses
    (Chunk 3 confirms Embedded Processing is a distinct operating segment with 16% revenue contribution in 2024, emphasizing
    its structural independence from corporate charges).
  final_answer: 'POINT 1 [COMPLETE]: Restructuring charges in Other represented $257 million of Texas Instruments’ $20,028
    million total 2022 revenue: ($257 million ÷ $20,028 million) × 100 = 1.283% (approximately 1.28%). [TXN_10k_2024.pdf::page_31::chunk_3]


    POINT 2 [COMPLETE]: Texas Instruments has two reportable segments, Analog and Embedded Processing, while Other contains
    remaining activities and items not used to evaluate segment results or allocate resources, including acquisition, integration,
    and restructuring charges; therefore, the $257 million restructuring charge was reported in Other rather than Embedded
    Processing. [TXN_10k_2024.pdf::page_30::chunk_1] [TXN_10k_2023.pdf::page_30::chunk_1]'
