# SEC EDGAR settings
edgar:
  email: ${EDGAR_EMAIL}
  organization: ${EDGAR_ORGANIZATION}
  filing_types:
    - "10-K"
  limit: 3

# Tickers in corpus — auto-synced from Neo4j by `scripts/pilot.py` (DB = source
# of truth). _ticker.py CORPUS_TICKERS derives from this list. Do not edit by hand.
tickers:
  - AMAT
  - AMD
  - AMKR
  - AVGO
  - COHR
  - INTC
  - KLAC
  - LRCX
  - MU
  - NVDA
  - QCOM
  - RMBS
  - TXN

# Data paths
paths:
  raw: "data/raw"
  processed: "data/processed"
  logs: "log"
  news: "data/news"
  schemas: "data/schemas"
  evaluate: "data/evaluate"

# Preprocessing
preprocess:
  markdown_method: "html2text"  # html2text | markitdown | beautifulsoup
  extract_sections: true
  use_fallback_extraction: true
  # KG extraction targets — narrative-rich sections only.
  # Item 5 (stock perf) and Item 8 (financial tables) are skipped — their
  # numeric data lives in PostgreSQL via the financial_query tool instead.
  target_sections:
    - "Item 1"
    - "Item 1A"
    - "Item 7"

# Text splitting (for KG extraction)
chunker:
  chunk_size: 4500
  chunk_overlap: 600

# LLM
llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  temperature: 0.0
  base_url: "https://api.deepseek.com"

# KG Extraction
kg:
  max_workers: 16
  batch_size: 5

# News tool (Phase E.v1 — Finnhub News API)
news:
  days_back: 90              # default date window (caller can override via param)
  cache_dir: "data/news/cache"
  default_depth: "headline"  # "headline" or "full" (newspaper3k scrape)

# Embeddings (Phase B — local HuggingFace model, no API)
embeddings:
  model: "BAAI/bge-base-en-v1.5"   # 768 dim, ~1.5 GB RAM, MTEB 63.5
  dimensions: 768
  batch_size: 32                    # CPU-friendly; raise on GPU
  device: "cpu"                     # "cpu" | "cuda" | "mps"
  normalize: true                   # L2-normalize → cosine sim works as dot product
