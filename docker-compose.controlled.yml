services:
  neo4j-controlled:
    image: neo4j:2025.04-community
    container_name: semigraph-controlled
    ports:
      - "7477:7474"
      - "7690:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "128M"
      NEO4J_server_memory_heap_max__size: "512M"
      NEO4J_server_memory_pagecache_size: "128M"
      NEO4J_db_tx__log_rotation_retention__policy: "false"
      NEO4J_db_tx__log_preallocate: "false"
    volumes:
      - ${CONTROLLED_NEO4J_DIR:-/home/kantinan/.local/share/semigraph/controlled-neo4j}/data:/data
      - ${CONTROLLED_NEO4J_DIR:-/home/kantinan/.local/share/semigraph/controlled-neo4j}/logs:/logs
      - ${CONTROLLED_NEO4J_DIR:-/home/kantinan/.local/share/semigraph/controlled-neo4j}/import:/var/lib/neo4j/import
      - ${CONTROLLED_NEO4J_DIR:-/home/kantinan/.local/share/semigraph/controlled-neo4j}/plugins-2025.04:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
