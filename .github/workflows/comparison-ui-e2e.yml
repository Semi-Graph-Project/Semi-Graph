name: Comparison UI E2E

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -e '.[e2e]'
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run deterministic UI checks
        run: pytest tests/test_demo_ui.py tests/test_demo_backend.py tests/e2e/test_comparison_ui.py -q
